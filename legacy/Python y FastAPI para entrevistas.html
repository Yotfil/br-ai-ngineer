{
 id:17, block:'B', title:`Base de datos: SQLAlchemy o SQLModel, sesiones y migraciones`, short:`BD, sesiones y Alembic`, freq:'casi',
 def:`Un <b>ORM</b> mapea clases a tablas. SQLAlchemy 2.0 es el estándar en Python; <b>SQLModel</b>, del mismo autor de FastAPI, combina SQLAlchemy y Pydantic y es lo que usa la documentación oficial. La <b>Session</b> es la unidad de trabajo de una petición: acumulas cambios y se aplican con <code>commit()</code>. <b>Alembic</b> versiona el esquema con migraciones.`,
 analogy:`La Session es un carrito de compras: agregas, cambias y quitas, pero nada se cobra hasta el commit. Las migraciones son las actas de cada remodelación del local: numeradas, en orden y reversibles.`,
 code:`from sqlmodel import Field, Session, SQLModel, create_engine, select

class Producto(SQLModel, table=True):
    id: int | None = Field(default=None, primary_key=True)
    nombre: str = Field(index=True)
    precio: int
    stock: int = 0

# PostgreSQL con psycopg 3 (uv add "psycopg[binary]")
DATABASE_URL = "postgresql+psycopg://tienda:secreto@localhost:5432/tienda"
engine = create_engine(DATABASE_URL)

@app.post("/productos", status_code=201)
def crear_producto(datos: ProductoCrear, session: SessionDep) -> Producto:
    producto = Producto.model_validate(datos)
    session.add(producto)
    session.commit()
    session.refresh(producto)        # trae el id generado
    return producto

@app.get("/productos")
def listar(session: SessionDep, categoria: str | None = None) -> list[Producto]:
    consulta = select(Producto)
    if categoria:
        consulta = consulta.where(Producto.categoria == categoria)
    return session.exec(consulta).all()

# Migraciones
# uv add alembic
# uv run alembic init migrations
# uv run alembic revision --autogenerate -m "crear tabla productos"
# uv run alembic upgrade head`,
 problem:`El problema N+1 (una consulta por cada fila al acceder a una relación) y concatenar texto en SQL son los dos errores que más se preguntan. Y <code>create_all()</code> no sirve para evolucionar el esquema en producción.`,
 bad:{code:`pedidos = session.exec(select(Pedido)).all()
for p in pedidos:
    print(p.cliente.nombre)    # 1 consulta por pedido

session.exec(text(f"SELECT * FROM productos WHERE nombre = '{nombre}'"))`, note:`N+1 consultas e inyección SQL.`},
 good:{code:`from sqlalchemy.orm import selectinload

consulta = select(Pedido).options(selectinload(Pedido.cliente))
pedidos = session.exec(consulta).all()   # 2 consultas en total

session.exec(select(Producto).where(Producto.nombre == nombre))`, note:`Carga anticipada y parámetros enlazados por el ORM.`},
 bridge:`SQLModel o SQLAlchemy ≈ TypeORM o Prisma; Alembic ≈ <code>prisma migrate</code> o las migraciones de TypeORM. La Session se parece al <code>EntityManager</code> de TypeORM: un unit of work que agrupa cambios.`,
 pitfalls:[`Olvidar <code>commit()</code>: no se guarda nada.`,`Compartir una sesión global entre peticiones.`,`No revisar el script de <code>--autogenerate</code>: Alembic no detecta todo (por ejemplo, renombrados).`,`Mezclar AsyncSession con un driver síncrono.`],
 answer:`Uso SQLAlchemy o SQLModel para mapear modelos a tablas, con una sesión por petición inyectada como dependencia, que se cierra al terminar. Agrego objetos a la sesión, hago commit y refresh para obtener los valores generados. Para evitar N+1 cargo relaciones con selectinload o joinedload, nunca concateno SQL, y el esquema lo evoluciono con migraciones de Alembic revisadas a mano, no con create_all en producción.`,
 demo:{type:'toggle', title:`El problema N+1, contado en consultas`, hint:`Listar 5 pedidos con el nombre de su cliente.`, options:[
  {label:`Carga perezosa (lazy)`, code:`pedidos = session.exec(select(Pedido)).all()
for p in pedidos:
    print(p.cliente.nombre)`, out:`SELECT * FROM pedido;
SELECT * FROM cliente WHERE id = 7;
SELECT * FROM cliente WHERE id = 3;
SELECT * FROM cliente WHERE id = 7;
SELECT * FROM cliente WHERE id = 12;
SELECT * FROM cliente WHERE id = 5;
→ 6 consultas (1 + N). Con 1.000 pedidos: 1.001`, note:`Cada acceso a p.cliente dispara una consulta.`},
  {label:`selectinload`, code:`consulta = select(Pedido).options(selectinload(Pedido.cliente))
pedidos = session.exec(consulta).all()`, out:`SELECT * FROM pedido;
SELECT * FROM cliente WHERE id IN (7, 3, 12, 5);
→ 2 consultas, sin importar cuántos pedidos haya`, note:`Ideal para relaciones uno a muchos.`},
  {label:`joinedload`, code:`consulta = select(Pedido).options(joinedload(Pedido.cliente))
pedidos = session.exec(consulta).all()`, out:`SELECT pedido.*, cliente.* FROM pedido
LEFT OUTER JOIN cliente ON cliente.id = pedido.cliente_id;
→ 1 consulta`, note:`Útil para relaciones muchos a uno, como pedido → cliente.`}
 ]},
 ex:[
  {kind:'concept', q:`Hiciste <code>session.add(producto)</code> y respondiste 201, pero el producto no aparece en la base de datos. ¿Qué faltó?`, opts:[`refresh()`,`commit()`,`flush()`,`close()`], a:1, exp:`Sin commit la transacción se descarta al cerrar la sesión.`},
  {kind:'concept', q:`¿Qué hace <code>alembic revision --autogenerate</code>?`, opts:[`Aplica las migraciones`,`Compara tus modelos con el esquema actual y genera un script para revisar`,`Borra y recrea las tablas`,`Genera los modelos desde la BD`], a:1, exp:`Genera la migración; la aplicas con <code>alembic upgrade head</code> después de revisarla.`}
 ]
},
{
 id:18, block:'B', title:`Autenticación y autorización: JWT, OAuth2 y hashing`, short:`JWT, OAuth2 y hashing`, freq:'casi',
 def:`<b>Autenticación</b>: quién eres. <b>Autorización</b>: qué puedes hacer. El flujo de la documentación de FastAPI: <code>POST /token</code> con usuario y contraseña (OAuth2 password flow) → JWT firmado → el cliente lo envía en <code>Authorization: Bearer</code> → una dependencia lo verifica en cada petición. Las contraseñas se guardan como hash con <b>Argon2</b> usando <b>pwdlib</b>, y los JWT se firman con <b>PyJWT</b>.`,
 analogy:`El JWT es la manilla de un concierto: te la ponen en la entrada tras revisar tu boleta; adentro nadie vuelve a la taquilla, solo verifican que la manilla sea auténtica y no esté vencida. Pero cualquiera puede leer lo que dice la manilla.`,
 code:`from datetime import datetime, timedelta, timezone
from typing import Annotated

import jwt
from fastapi import Depends, HTTPException, status
from fastapi.security import OAuth2PasswordBearer, OAuth2PasswordRequestForm
from jwt.exceptions import InvalidTokenError
from pwdlib import PasswordHash

password_hash = PasswordHash.recommended()          # Argon2
oauth2_scheme = OAuth2PasswordBearer(tokenUrl="token")

def crear_token(sub: str, minutos: int = 30) -> str:
    expira = datetime.now(timezone.utc) + timedelta(minutes=minutos)
    return jwt.encode({"sub": sub, "exp": expira}, settings.secret_key, algorithm="HS256")

async def get_cliente_actual(
    token: Annotated[str, Depends(oauth2_scheme)], session: SessionDep
) -> Cliente:
    error = HTTPException(
        status_code=status.HTTP_401_UNAUTHORIZED,
        detail="Credenciales inválidas",
        headers={"WWW-Authenticate": "Bearer"},
    )
    try:
        payload = jwt.decode(token, settings.secret_key, algorithms=["HS256"])
    except InvalidTokenError:          # firma alterada, vencido, mal formado
        raise error
    cliente = buscar_por_email(session, payload.get("sub"))
    if cliente is None:
        raise error
    return cliente

ClienteActual = Annotated[Cliente, Depends(get_cliente_actual)]

def requiere_admin(cliente: ClienteActual) -> Cliente:
    if not cliente.es_admin:
        raise HTTPException(status_code=403, detail="Solo administradores")
    return cliente

@app.post("/token")
async def login(form: Annotated[OAuth2PasswordRequestForm, Depends()], session: SessionDep) -> Token:
    cliente = buscar_por_email(session, form.username)
    if not cliente or not password_hash.verify(form.password, cliente.hashed_password):
        raise HTTPException(401, "Usuario o contraseña incorrectos",
                            headers={"WWW-Authenticate": "Bearer"})
    return Token(access_token=crear_token(cliente.email), token_type="bearer")`,
 problem:`Guardar contraseñas en texto plano o con un hash rápido (MD5, SHA-256 sin sal) permite recuperarlas si se filtra la base. Poner datos sensibles en el JWT los expone: el payload solo está codificado en base64, no cifrado.`,
 bad:{code:`cliente.password = form.password                 # texto plano
token = jwt.encode({"sub": email, "password": pwd, "tarjeta": "..."}, "1234")`, note:`Contraseña sin hash, datos sensibles en el payload y una clave débil en el código.`},
 good:{code:`cliente.hashed_password = password_hash.hash(form.password)
token = jwt.encode({"sub": email, "exp": expira}, settings.secret_key,
                   algorithm="HS256")`, note:`Argon2, payload mínimo con expiración y clave desde configuración (openssl rand -hex 32).`},
 bridge:`En Angular guardabas el token y un interceptor añadía <code>Authorization: Bearer</code>; ahora estás del otro lado. Los <b>guards</b> de Angular se parecen a dependencias como <code>requiere_admin</code>, con una diferencia de fondo: el guard del frontend es experiencia de usuario; la dependencia del backend es la seguridad real.`,
 pitfalls:[`Confundir 401 (token ausente o inválido) con 403 (token válido, sin permiso).`,`Creer que el payload es secreto.`,`Tokens sin expiración o imposibles de revocar: usa vida corta y refresh tokens.`,`<code>OAuth2PasswordRequestForm</code> espera form-data, no JSON (necesita python-multipart, incluido en <code>fastapi[standard]</code>).`],
 answer:`Autenticación es verificar identidad y autorización es verificar permisos. En FastAPI expongo un endpoint de token con el flujo password de OAuth2: verifico la contraseña contra un hash Argon2 y emito un JWT firmado con expiración corta y el identificador en sub. Una dependencia lee el Bearer token, lo decodifica con la clave y algoritmo esperados, carga el usuario y responde 401 si algo falla. Encima pongo dependencias de autorización que responden 403. El payload del JWT es legible, así que no lleva datos sensibles.`,
 demo:{type:'pipeline', title:`Peticiones protegidas`, hint:`Prueba con y sin token.`, stages:['Middleware','Ruta','oauth2_scheme','get_cliente_actual','Permisos','Respuesta'], scenarios:[
  {label:`Sin token`, req:`GET /pedidos/mios`, st:['ok','ok','fail','skip','skip','ok'], log:['Middleware: registra la petición','Ruta: /pedidos/mios','No hay cabecera Authorization','No se consulta la BD','',''], status:401, body:`{"detail": "Not authenticated"}`},
  {label:`Token vencido`, req:`GET /pedidos/mios
Authorization: Bearer eyJ...(exp pasado)`, st:['ok','ok','ok','fail','skip','ok'], log:['Middleware','Ruta','Extrae el token','jwt.decode lanza ExpiredSignatureError (es un InvalidTokenError)','',''], status:401, body:`{"detail": "Credenciales inválidas"}`},
  {label:`Token válido de Ana`, req:`GET /pedidos/mios
Authorization: Bearer eyJ...`, st:['ok','ok','ok','ok','ok','ok'], log:['Middleware','Ruta','Extrae el token','Firma y exp OK; carga a Ana','No requiere rol especial','Handler devuelve sus pedidos'], status:200, body:`[{"id": 1042, "estado": "pendiente"}]`},
  {label:`Ana entra a /admin/reportes`, req:`GET /admin/reportes
Authorization: Bearer eyJ...`, st:['ok','ok','ok','ok','fail','ok'], log:['Middleware','Ruta','Extrae el token','Token válido: Ana','requiere_admin: Ana no es admin',''], status:403, body:`{"detail": "Solo administradores"}`}
 ]},
 ex:[
  {kind:'status', q:`Alguien cambia un carácter del payload del JWT y lo envía.`, opts:[`200`,`401`,`403`,`422`], a:1, exp:`La firma ya no coincide: <code>InvalidSignatureError</code> → 401.`},
  {kind:'concept', q:`¿El payload de un JWT es secreto?`, opts:[`Sí, está cifrado`,`No, está codificado en base64url y cualquiera lo lee; la firma solo garantiza que no se alteró`,`Solo si usas HS256`,`Solo en HTTPS`], a:1, exp:`Firmar no es cifrar. No pongas datos sensibles en el payload.`}
 ]
},
{
 id:19, block:'B', title:`Middleware, CORS y tareas en segundo plano`, short:`Middleware, CORS, background`, freq:'seguido',
 def:`Un <b>middleware</b> envuelve cada petición y respuesta (logs, tiempos, cabeceras). <b>CORS</b> es una regla del navegador: bloquea respuestas de otro origen salvo que el servidor lo permita con cabeceras; se configura con <code>CORSMiddleware</code>. <b>BackgroundTasks</b> ejecuta algo después de enviar la respuesta, como un correo de confirmación.`,
 analogy:`El middleware es el portero del edificio: todos pasan por él al entrar y al salir. La tarea en segundo plano es «te enviamos el recibo por correo»: te vas con tu café y el correo sale después.`,
 code:`import time
from fastapi import BackgroundTasks, Request
from fastapi.middleware.cors import CORSMiddleware

app.add_middleware(
    CORSMiddleware,
    allow_origins=["http://localhost:4200", "https://tienda.co"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)

@app.middleware("http")
async def medir_tiempo(request: Request, call_next):
    inicio = time.perf_counter()
    response = await call_next(request)        # sigue la cadena
    response.headers["X-Process-Time"] = f"{time.perf_counter() - inicio:.4f}"
    return response

def enviar_confirmacion(email: str, pedido_id: int) -> None:
    ...  # SMTP: lento

@app.post("/pedidos", status_code=201)
def crear_pedido(datos: PedidoCrear, tareas: BackgroundTasks, cliente: ClienteActual):
    pedido = guardar_pedido(datos, cliente)
    tareas.add_task(enviar_confirmacion, cliente.email, pedido.id)
    return pedido                               # el cliente no espera el correo`,
 problem:`Sin CORS configurado, tu app Angular en <code>localhost:4200</code> no puede leer las respuestas de la API en <code>localhost:8000</code>. Sin tareas en segundo plano, el usuario espera a que salga un correo para ver su pedido.`,
 bad:{code:`app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
)`, note:`Cualquier sitio web podría hacer peticiones con las credenciales de tus usuarios. La especificación de CORS no admite * cuando hay credenciales.`},
 good:{code:`app.add_middleware(
    CORSMiddleware,
    allow_origins=settings.cors_origins,   # lista explícita
    allow_credentials=True,
    allow_methods=["GET", "POST", "PATCH", "DELETE"],
)`, note:`Orígenes explícitos desde configuración.`},
 bridge:`El middleware es el <code>HttpInterceptor</code> de Angular, pero del lado del servidor: <code>await call_next(request)</code> ≈ <code>next.handle(req)</code>. También se parece al <code>(req, res, next)</code> de Express. Y el error de CORS que veías en la consola de Chrome se arregla aquí, no en Angular (en desarrollo también lo esquivabas con <code>proxy.conf.json</code>).`,
 pitfalls:[`Creer que CORS protege tu API: solo lo aplican los navegadores; curl o Postman lo ignoran.`,`Usar BackgroundTasks para trabajos pesados o críticos: si el proceso se reinicia, se pierden. Usa una cola (Celery, ARQ, RQ).`,`Olvidar que las peticiones con JSON o Authorization generan un preflight OPTIONS.`,`Registrar CORS después de otros middlewares que pueden responder antes.`],
 answer:`El middleware intercepta todas las peticiones y respuestas; lo uso para logs, métricas o cabeceras, como un interceptor de Angular pero en el servidor. CORS es una protección del navegador: configuro CORSMiddleware con una lista explícita de orígenes, nunca asterisco con credenciales, sabiendo que no protege contra clientes que no son navegadores. Para trabajo que no debe retrasar la respuesta, como enviar un correo, uso BackgroundTasks; si es pesado o no puede perderse, una cola de tareas.`,
 demo:{type:'toggle', title:`CORS desde el navegador`, hint:`Tu Angular hace POST /pedidos con JSON y token.`, options:[
  {label:`Desde localhost:4200 (permitido)`, code:`OPTIONS /pedidos            ← preflight del navegador
Origin: http://localhost:4200
Access-Control-Request-Method: POST`, out:`200 OK
access-control-allow-origin: http://localhost:4200
access-control-allow-credentials: true
→ el navegador envía el POST real → 201 Created`, note:`El preflight aprueba y el navegador continúa.`},
  {label:`Desde https://otro-sitio.com`, code:`OPTIONS /pedidos
Origin: https://otro-sitio.com`, out:`400 Disallowed CORS origin
(sin access-control-allow-origin)
→ el navegador NO envía el POST y muestra el error de CORS en consola`, note:`El servidor no aprobó el origen.`},
  {label:`Desde curl o Postman`, code:`curl -X POST https://api.tienda.co/pedidos -H "Authorization: Bearer ..."`, out:`201 Created`, note:`No hay navegador, no hay CORS. Por eso CORS no reemplaza a la autenticación.`}
 ]},
 ex:[
  {kind:'concept', q:`¿Cuándo se ejecuta una tarea agregada con <code>tareas.add_task(...)</code>?`, opts:[`Antes del handler`,`En paralelo con el handler`,`Después de enviar la respuesta`,`Al reiniciar el servidor`], a:2, exp:`El cliente recibe la respuesta y luego corre la tarea.`},

 ]

{
 id:20, block:'B', title:`Estructura de un proyecto real`, short:`Estructura del proyecto`, freq:'seguido',
 def:`Separa por responsabilidad: <b>routers</b> (HTTP), <b>servicios</b> (reglas de negocio), <b>repositorios</b> (acceso a datos), <b>schemas</b> (Pydantic), <b>models</b> (tablas) y <b>configuración</b> con pydantic-settings. <code>APIRouter</code> modulariza las rutas y <code>lifespan</code> maneja el arranque y el apagado (los eventos <code>on_event</code> están deprecados).`,
 analogy:`En un restaurante, el mesero (router) toma el pedido, el chef (servicio) decide cómo prepararlo y el bodeguero (repositorio) trae los ingredientes. El mesero no cocina y el chef no atiende mesas.`,
 code:`tienda-api/
├── pyproject.toml
├── uv.lock
├── .env                    # nunca al repo
├── alembic.ini
├── migrations/
├── app/
│   ├── main.py             # crea FastAPI, lifespan, incluye routers
│   ├── core/
│   │   ├── config.py       # Settings
│   │   └── security.py     # hash y JWT
│   ├── db.py               # engine y get_session
│   ├── deps.py             # SessionDep, ClienteActual
│   ├── pedidos/
│   │   ├── router.py
│   │   ├── schemas.py
│   │   ├── models.py
│   │   ├── service.py
│   │   └── repository.py
│   └── productos/ ...
└── tests/`, codeLang:'txt',
 code2:`# app/core/config.py
from pydantic_settings import BaseSettings, SettingsConfigDict

class Settings(BaseSettings):
    model_config = SettingsConfigDict(env_file=".env")
    database_url: str
    secret_key: str
    token_minutos: int = 30
    cors_origins: list[str] = ["http://localhost:4200"]

settings = Settings()

# app/pedidos/router.py
router = APIRouter(prefix="/pedidos", tags=["pedidos"])

@router.post("", status_code=201)
def crear(datos: PedidoCrear, cliente: ClienteActual, session: SessionDep) -> PedidoPublico:
    return PedidoService(session).crear(datos, cliente)

# app/main.py
@asynccontextmanager
async def lifespan(app: FastAPI):
    # arranque: conexiones, cargar modelos de IA, etc.
    yield
    # apagado: liberar recursos

app = FastAPI(title="Tienda API", lifespan=lifespan)
app.include_router(pedidos.router)
app.include_router(productos.router)`,
 problem:`Con todo en <code>main.py</code>, la lógica de negocio queda mezclada con HTTP y SQL: no se puede probar sin levantar la API ni reutilizar desde un script o un worker.`,
 bad:{code:`@app.post("/pedidos")
def crear(datos: dict):
    con = psycopg.connect("postgres://admin:1234@...")
    total = sum(i["precio"] * i["cantidad"] for i in datos["items"])
    if total > 1_000_000: ...
    con.execute(f"INSERT INTO pedido ...")`, note:`Credenciales en el código, sin validación, reglas y SQL en el handler.`},
 good:{code:`@router.post("", status_code=201)
def crear(datos: PedidoCrear, servicio: PedidoServiceDep) -> PedidoPublico:
    return servicio.crear(datos)`, note:`El router solo traduce HTTP; el servicio contiene la regla y se prueba solo.`},
 bridge:`Es la organización por <i>features</i> que ya usas en Angular: cada carpeta con su router (como las rutas del feature), sus servicios y sus modelos. <code>Settings</code> ≈ <code>environment.ts</code>, pero se lee de variables de entorno en ejecución, no al compilar.`,
 pitfalls:[`Sobreingeniería: un repositorio para un CRUD de tres tablas puede sobrar. Empieza simple.`,`Commitear el <code>.env</code> con secretos.`,`Usar <code>@app.on_event("startup")</code>: está deprecado, usa <code>lifespan</code>.`,`Imports circulares entre módulos de distintos features.`],
 answer:`Organizo por features, y dentro de cada uno separo router, esquemas, modelos, servicio y, si hace falta, repositorio. El router solo maneja HTTP; el servicio tiene las reglas de negocio y no conoce HTTP; el repositorio encapsula las consultas. La configuración sale de variables de entorno con pydantic-settings, las dependencias comunes viven en un módulo deps, y uso lifespan para el arranque y el apagado. Ajusto la cantidad de capas al tamaño del proyecto.`,
 demo:{type:'stepper', title:`Una petición POST /pedidos atraviesa las capas`, hint:`Avanza capa por capa.`, code:`# router.py
@router.post("", status_code=201)
def crear(datos: PedidoCrear, servicio: PedidoServiceDep) -> PedidoPublico:
    return servicio.crear(datos)

# service.py
class PedidoService:
    def crear(self, datos: PedidoCrear) -> Pedido:
        for item in datos.items:
            if self.repo_productos.stock(item.producto_id) < item.cantidad:
                raise StockInsuficiente(item.producto_id)
        total = self.calcular_total(datos)
        return self.repo_pedidos.insertar(datos, total)

# repository.py
class PedidoRepository:
    def insertar(self, datos, total) -> Pedido:
        pedido = Pedido(**datos.model_dump(exclude={"items"}), total=total)
        self.session.add(pedido)
        self.session.commit()
        self.session.refresh(pedido)
        return pedido`, steps:[
  {hl:[2,3], text:`Router: FastAPI ya validó el body con PedidoCrear y resolvió el servicio como dependencia.`, out:``},
  {hl:[4], text:`El router delega. No calcula ni consulta nada.`, out:``},
  {hl:[8,9,10,11], text:`Servicio: aplica la regla de negocio (hay stock). Si falla, lanza una excepción de dominio.`, out:`stock OK`},
  {hl:[12], text:`Servicio: calcula el total. Esta lógica se prueba sin HTTP ni BD real.`, out:`total = 50000`},
  {hl:[13,17,18,19,20,21], text:`Repositorio: único lugar que habla con la base de datos.`, out:`INSERT INTO pedido ... → id 1042`},
  {hl:[3], text:`De vuelta en el router, FastAPI filtra con PedidoPublico y responde 201.`, out:`201 Created {"id": 1042, ...}`}
 ]},

 id:21, block:'B', title:`Testing con pytest y TestClient`, short:`pytest y TestClient`, freq:'seguido',
 def:`<b>pytest</b> descubre funciones <code>test_*</code> en archivos <code>test_*.py</code>, usa <code>assert</code> normal y prepara contexto con <b>fixtures</b>, que se inyectan por nombre de parámetro. <b>TestClient</b> (basado en HTTPX) hace peticiones a tu app sin levantar un servidor. <code>app.dependency_overrides</code> reemplaza la BD o el usuario actual.`,
 analogy:`Un ensayo general con utilería: el escenario y los actores son los reales, pero la comida es de plástico.`,
 code:`import pytest
from fastapi.testclient import TestClient
from sqlmodel import Session, SQLModel, create_engine
from sqlmodel.pool import StaticPool

from app.main import app
from app.db import get_session

@pytest.fixture
def session():
    engine = create_engine("sqlite://", connect_args={"check_same_thread": False},
                           poolclass=StaticPool)      # BD en memoria
    SQLModel.metadata.create_all(engine)
    with Session(engine) as s:
        yield s

@pytest.fixture
def client(session):
    app.dependency_overrides[get_session] = lambda: session
    with TestClient(app) as c:                         # corre el lifespan
        yield c
    app.dependency_overrides.clear()

def test_crear_producto(client):
    r = client.post("/productos", json={"nombre": "Café", "precio": 25000})
    assert r.status_code == 201
    assert r.json()["nombre"] == "Café"

@pytest.mark.parametrize("limite, esperado", [(1, 200), (100, 200), (101, 422)])
def test_limite(client, limite, esperado):
    assert client.get(f"/productos?limite={limite}").status_code == esperado`,
 problem:`Sin tests, cada cambio en un modelo o una dependencia puede romper endpoints en silencio. Con tests que usan la BD de desarrollo, los resultados dependen del orden y de datos viejos.`,
 bad:{code:`def test_crear():
    r = requests.post("http://localhost:8000/productos", json={...})
    assert r.status_code == 201   # requiere servidor y BD reales`, note:`Lento, frágil y deja basura en la base.`},
 good:{code:`def test_crear(client):
    r = client.post("/productos", json={...})
    assert r.status_code == 201`, note:`Sin servidor, con BD aislada por fixture.`},
 bridge:`pytest ≈ Jest o Jasmine, y <code>assert</code> ≈ <code>expect</code>. Una fixture ≈ <code>beforeEach</code>, pero se inyecta por el <b>nombre del parámetro</b> (otra vez inyección de dependencias). <code>dependency_overrides</code> ≈ <code>TestBed.overrideProvider</code>, y TestClient ≈ supertest.`,
 pitfalls:[`No limpiar <code>dependency_overrides</code> y contaminar otros tests.`,`Probar solo el camino feliz: los 401, 404 y 422 también son contrato.`,`No usar <code>with TestClient(app)</code>: sin el with no corre el lifespan.`,`Archivos o funciones sin el prefijo <code>test_</code>: pytest no los encuentra.`],
 answer:`Uso pytest con fixtures para preparar una base de datos aislada, normalmente SQLite en memoria o un Postgres de pruebas, y TestClient para llamar los endpoints sin servidor. Con dependency_overrides reemplazo la sesión y el usuario autenticado. Pruebo el camino feliz y los errores: validación 422, 401, 403 y 404. Con parametrize cubro varios casos sin duplicar código, y las reglas de negocio de los servicios las pruebo con tests unitarios sin HTTP.`,

 id:22, block:'B', title:`OpenAPI automático y despliegue con Uvicorn y Docker`, short:`OpenAPI, Uvicorn y Docker`, freq:'seguido',
 def:`FastAPI genera un esquema <b>OpenAPI</b> a partir de rutas, type hints y modelos, y lo sirve en <code>/docs</code> (Swagger UI), <code>/redoc</code> y <code>/openapi.json</code>. En producción corre sobre <b>Uvicorn</b>, un servidor ASGI; <code>fastapi run</code> lo usa por debajo. La documentación oficial lo empaqueta en Docker con la imagen <code>python:3.14</code>.`,
 analogy:`OpenAPI es la carta del restaurante que se reimprime sola cada vez que cambias una receta.`,
 code:`app = FastAPI(title="Tienda API", version="1.0.0")

@app.get(
    "/productos/{producto_id}",
    tags=["productos"],
    summary="Obtener un producto",
    responses={404: {"description": "El producto no existe"}},
)
def obtener(producto_id: int) -> ProductoPublico: ...

# Desarrollo: recarga automática, solo en 127.0.0.1
#   uv run fastapi dev app/main.py
# Producción: sin recarga, escucha en 0.0.0.0
#   fastapi run app/main.py --port 80`,
 code2:`# Dockerfile (basado en la documentación oficial)
FROM python:3.14
WORKDIR /code
COPY ./requirements.txt /code/requirements.txt      # generado con uv export
RUN pip install --no-cache-dir --upgrade -r /code/requirements.txt
COPY ./app /code/app
CMD ["fastapi", "run", "app/main.py", "--port", "80"]

# compose.yaml
services:
  api:
    build: .
    ports: ["8000:80"]
    env_file: .env          # DATABASE_URL=postgresql+psycopg://tienda:secreto@db:5432/tienda
    depends_on: [db]
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: secreto
      POSTGRES_DB: tienda
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:`, code2Lang:'txt',
 problem:`La documentación escrita a mano se desactualiza al primer cambio. En despliegue, usar el modo dev o la forma shell del CMD causa problemas: recarga innecesaria y un apagado que no ejecuta el lifespan.`,
 bad:{code:`CMD fastapi dev app/main.py --host 0.0.0.0
# DATABASE_URL=...@localhost:5432/tienda`, note:`Modo dev en producción, CMD en forma shell (sin apagado limpio) y localhost dentro del contenedor, que es el propio contenedor.`},
 good:{code:`CMD ["fastapi", "run", "app/main.py", "--port", "80"]
# DATABASE_URL=...@db:5432/tienda`, note:`Forma exec y el nombre del servicio de Compose como host.`},
 bridge:`<code>fastapi dev</code> vs <code>fastapi run</code> ≈ <code>ng serve</code> vs servir el build. Uvicorn ocupa el lugar del servidor HTTP de Node. Con <code>/openapi.json</code> puedes generar el cliente tipado de Angular con openapi-generator y dejar de escribir interfaces a mano.`,
 pitfalls:[`Usar <code>localhost</code> para la BD dentro de Docker Compose: usa el nombre del servicio.`,`Meter secretos en la imagen en vez de variables de entorno.`,`Dejar <code>/docs</code> público en una API interna sin pensarlo.`,`Varios workers en un contenedor cuando ya escalas con réplicas: la doc recomienda un proceso por contenedor en ese caso.`],
 answer:`FastAPI genera OpenAPI automáticamente a partir de los type hints y los modelos Pydantic, así que Swagger siempre refleja el código y puedo generar clientes tipados. Para producción uso fastapi run, que corre Uvicorn sin recarga, dentro de un contenedor Docker con el CMD en forma exec para un apagado limpio. La configuración llega por variables de entorno, y con Docker Compose levanto la API junto a PostgreSQL usando el nombre del servicio como host.`,

const OPEN_QS = [
 {q:`¿Cuál es la diferencia entre una lista y una tupla, y cuándo usarías cada una?`, a:`La lista es mutable y la uso para colecciones que cambian; la tupla es inmutable, más liviana y hashable si su contenido lo es, así que sirve para registros fijos y como clave de diccionario. También comunica intención: si es tupla, nadie debería modificarla.`},
 {q:`¿Qué es el GIL y cómo afecta a una API hecha con FastAPI?`, a:`Es un candado de CPython que deja a un solo hilo ejecutar bytecode a la vez. En una API casi todo es I/O, así que no estorba mucho: async y el threadpool sueltan el candado mientras esperan. Afecta al cálculo pesado, que mando a procesos o a una cola. Existe una compilación sin GIL, pero aún no es la estándar.`},
 {q:`Explícame cómo funciona un decorador por dentro.`, a:`Es una función que recibe otra y devuelve una nueva que la envuelve. La arroba equivale a reasignar el nombre. El wrapper recibe args y kwargs, hace algo antes, llama a la original, hace algo después y devuelve el resultado; con functools.wraps conserva nombre y firma, algo clave en FastAPI porque lee la firma.`},
 {q:`¿Qué pasa si pongo time.sleep(2) dentro de un endpoint async def?`, a:`Bloquea el event loop dos segundos y ninguna otra petición avanza: el servidor atiende en fila. La solución es usar await asyncio.sleep o librerías async, o declarar el endpoint con def para que FastAPI lo ejecute en el threadpool.`},
 {q:`¿Por qué separas modelos de entrada y de salida?`, a:`Porque lo que el cliente puede enviar y lo que puedo exponer son contratos distintos. El de entrada valida y evita campos como es_admin; el de salida filtra datos sensibles como el hash de la contraseña. Con herencia desde una clase base no repito campos.`},
 {q:`¿Cómo implementarías autenticación con JWT en FastAPI?`, a:`Un endpoint de token con OAuth2PasswordRequestForm que verifica la contraseña contra un hash Argon2 y devuelve un JWT firmado con sub y exp. Una dependencia con OAuth2PasswordBearer extrae el token, lo decodifica con PyJWT, carga el usuario y responde 401 si algo falla. Encima, dependencias de permisos que responden 403.`},
 {q:`¿Qué es la idempotencia y qué métodos HTTP la cumplen?`, a:`Repetir la petición deja el servidor en el mismo estado que hacerla una vez. GET, PUT y DELETE son idempotentes; POST no, y PATCH no está garantizado. Importa para reintentos: un PUT se puede reintentar sin miedo, un POST puede duplicar un pedido si no uso una clave de idempotencia.`},
 {q:`¿Cómo funciona la inyección de dependencias de FastAPI y en qué se diferencia de la de Angular?`, a:`Declaro con Depends qué función produce un parámetro y FastAPI arma el árbol y lo ejecuta en cada petición, con caché dentro de la petición y limpieza con yield. Angular resuelve por tipo o token y sus servicios suelen ser singletons. En tests uso dependency_overrides, como overrideProvider en TestBed.`},
 {q:`¿Cómo testeas un endpoint que necesita base de datos y usuario autenticado?`, a:`Con fixtures de pytest creo una base aislada y un TestClient. Con dependency_overrides reemplazo get_session por la sesión de prueba y get_cliente_actual por un usuario falso. Pruebo el caso feliz y los errores 401, 403, 404 y 422, y limpio los overrides al final.`},
 {q:`¿Qué es el problema N+1 y cómo lo evitas?`, a:`Hacer una consulta para la lista y luego una por cada elemento al acceder a una relación. Con mil pedidos son mil y una consultas. Lo evito con carga anticipada: selectinload para colecciones o joinedload para relaciones muchos a uno, y lo detecto activando el log de SQL.`},
 {q:`¿Cómo estructurarías un proyecto FastAPI para un equipo?`, a:`Por features, cada uno con router, schemas, models y service; repositorio si el acceso a datos lo justifica. Configuración con pydantic-settings desde variables de entorno, dependencias comunes en un módulo, lifespan para el arranque, Alembic para migraciones, tests con pytest y todo en Docker.`},
 {q:`¿Cuál es la diferencia entre 401 y 403?`, a:`401 significa que no sé quién eres: falta el token o es inválido. 403 significa que sé quién eres pero no tienes permiso para ese recurso.`}
];

const TEST_QS = [
 {q:`¿Qué imprime <code>print([1, 2] == [1, 2], [1, 2] is [1, 2])</code>?`, opts:[`True True`,`True False`,`False False`,`False True`], a:1, exp:`== compara contenido; is compara identidad.`},

/* ───────────── APP ───────────── */
const KEY = 'guia-python-fastapi-v1';
const FREQ = {casi:'Casi siempre', seguido:'Seguido', aveces:'A veces'};
const STAGES = ['Middleware','Ruta','Validación','Dependencias','Handler','Respuesta'];
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function loadState(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function saveState(){ try { localStorage.setItem(KEY, JSON.stringify({done:[...done]})); } catch(e){} }
let done = new Set(loadState().done || []);
let filter = 'all';

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Resaltado mínimo de Python */
const KW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const BI = new Set('print len range sum sorted set dict list tuple int str float bool isinstance super open next round type frozenset'.split(' '));
const PYRE = /(#[^\n]*)|([rRbBfFuU]{0,2}(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'))|(@[A-Za-z_][\w.]*)|(\b\d[\d_]*(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
function hlPy(src){
  let out = '', last = 0, m;
  PYRE.lastIndex = 0;
  while ((m = PYRE.exec(src))){
    out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += '<span class="c">'+esc(t)+'</span>';
    else if (m[2]) out += '<span class="s">'+esc(t)+'</span>';
    else if (m[3]) out += '<span class="d">'+esc(t)+'</span>';
    else if (m[4]) out += '<span class="n">'+esc(t)+'</span>';
    else if (KW.has(t)) out += '<span class="k">'+t+'</span>';
    else if (BI.has(t)) out += '<span class="f">'+t+'</span>';
    else out += esc(t);
    last = PYRE.lastIndex;
  }
  return out + esc(src.slice(last));
}
function hlTxt(src){
  return src.split('\n').map(l => {
    const i = l.indexOf('#');
    if (i >= 0 && !/https?:\/\/|"[^"]*#/.test(l.slice(0,i+1))) return esc(l.slice(0,i)) + '<span class="c">'+esc(l.slice(i))+'</span>';
    return esc(l);
  }).join('\n');
}
function codeBlock(src, lang, hlLines){
  const html = (lang === 'txt' ? hlTxt(src) : hlPy(src));
  const lines = html.split('\n');
  const set = new Set(hlLines || []);
  return '<pre class="code" tabindex="0">' + lines.map((l,i) => '<span class="ln'+(set.has(i+1)?' hl':'')+'">'+(l||' ')+'</span>').join('') + '</pre>';
}

function freqTag(f){ return '<span class="freq '+f+'">'+FREQ[f]+'</span>'; }

/* ── Navegación ── */
function renderNav(){
  const nav = document.getElementById('nav');
  const link = (href, num, label, extra) => '<a class="navlink'+(extra||'')+'" href="#'+href+'" data-href="'+href+'"><span class="num">'+num+'</span><span>'+label+'</span><span class="ok" aria-hidden="true"></span></a>';
  let h = '<div class="navgroup">'+link('inicio','·','Inicio y progreso','')+'</div>';
  [['A','Bloque A · Python'],['B','Bloque B · HTTP y FastAPI']].forEach(([b,label]) => {
    h += '<div class="navgroup"><h4>'+label+'</h4>';
    TOPICS.filter(t => t.block === b).forEach(t => {
      const hide = filter !== 'all' && t.freq !== filter ? ' hide' : '';
      h += link('t'+t.id, String(t.id).padStart(2,'0'), t.short, (done.has(t.id)?' done':'')+hide);
    });
    h += '</div>';
  });
  h += '<div class="navgroup"><h4>Final</h4>'+link('simulacro','✓','Simulacro de entrevista','')+'</div>';
  nav.innerHTML = h;
  markCurrent();
  updateProgress();
}
function markCurrent(){
  const cur = (location.hash || '#inicio').slice(1);
  document.querySelectorAll('.navlink').forEach(a => {
    if (a.dataset.href === cur) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
}
function updateProgress(){
  const n = done.size;
  document.getElementById('progbar').style.width = (n/TOPICS.length*100)+'%';
  document.getElementById('progtxt').textContent = n+' de '+TOPICS.length+' temas repasados';
}
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  filter = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === c)));
  renderNav();
}));
const side = document.getElementById('side'), menuBtn = document.getElementById('menuBtn');
menuBtn.addEventListener('click', () => { const o = side.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(o)); });
document.getElementById('nav').addEventListener('click', e => { if (e.target.closest('a')) { side.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); } });

/* ── Vistas ── */
const main = document.getElementById('main');
function route(){
  const h = (location.hash || '#inicio').slice(1);
  const m = /^t(\d+)$/.exec(h);
  if (m && TOPICS.find(t => t.id === +m[1])) renderTopic(TOPICS.find(t => t.id === +m[1]));
  else if (h === 'simulacro') renderSim();
  else renderHome();
  markCurrent();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

function tableHtml(t){
  return '<div class="tablewrap"><table class="mini"><thead><tr>'+t.head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}

function renderTopic(t){
  const idx = TOPICS.indexOf(t), prev = TOPICS[idx-1], next = TOPICS[idx+1];
  let h = '<div class="wrap">';
  h += '<div class="title"><div class="eyebrow"><span>Bloque '+t.block+' · Tema '+t.id+' de 22</span>'+freqTag(t.freq)+'</div><h1>'+t.title+'</h1></div>';
  h += '<section class="blk"><h2>Definición</h2><div class="prose"><p>'+t.def+'</p></div><div class="analogy"><b>Analogía.</b> '+t.analogy+'</div></section>';
  h += '<section class="blk"><h2>Ejemplo <small>API de la tienda</small></h2>'+codeBlock(t.code, t.codeLang)+(t.code2?codeBlock(t.code2, t.code2Lang):'')+(t.table?tableHtml(t.table):'')+(t.table2?tableHtml(t.table2):'')+'</section>';
  h += '<section class="blk"><h2>Qué resuelve y qué pasa si se usa mal</h2><div class="prose"><p>'+t.problem+'</p></div><div class="cmp"><div class="bad"><span class="tag bad">Así no</span>'+codeBlock(t.bad.code, t.codeLang==='txt'&&t.id!==20?'txt':'py')+'<p>'+t.bad.note+'</p></div><div class="good"><span class="tag good">Así sí</span>'+codeBlock(t.good.code, t.codeLang==='txt'&&t.id!==20?'txt':'py')+'<p>'+t.good.note+'</p></div></div></section>';
  if (t.bridge) h += '<section class="blk"><h2>Puente con TypeScript y Angular</h2><div class="bridge">'+t.bridge+'</div></section>';
  h += '<section class="blk"><h2>Errores típicos de quien viene de JavaScript</h2><ul class="pit">'+t.pitfalls.map(p=>'<li>'+p+'</li>').join('')+'</ul></section>';
  h += '<section class="blk"><h2>Demo</h2><div class="card" id="demo"></div></section>';
  h += '<section class="blk"><h2>Ejercicios</h2><div id="exs" class="ex"></div></section>';
  h += '<section class="blk"><h2>Para decir en la entrevista</h2><div class="answer" id="ans"><div class="atext">'+t.answer+'</div></div><div class="row"><button class="btn" id="ansToggle" aria-pressed="false">Ocultar para ensayar en voz alta</button></div></section>';
  h += '<div class="row"><button class="mark" id="mark" aria-pressed="'+done.has(t.id)+'">'+(done.has(t.id)?'✓ Repasado':'Marcar como repasado')+'</button></div>';
  h += '<nav class="pager" aria-label="Temas">'+(prev?'<a href="#t'+prev.id+'">← '+prev.id+'. '+prev.short+'</a>':'<a href="#inicio">← Inicio</a>')+(next?'<a href="#t'+next.id+'" style="text-align:right">'+next.id+'. '+next.short+' →</a>':'<a href="#simulacro" style="text-align:right">Simulacro →</a>')+'</nav>';
  h += '</div>';
  main.innerHTML = h;
  DEMOS[t.demo.type](document.getElementById('demo'), t.demo);
  const exs = document.getElementById('exs');
  t.ex.forEach((e,i) => { const d = document.createElement('div'); d.className = 'card'; exs.appendChild(d); (e.kind === 'classify' ? mountClassify : mountMcq)(d, e, 't'+t.id+'e'+i); });
  const at = document.getElementById('ansToggle');
  at.addEventListener('click', () => { const on = document.getElementById('ans').classList.toggle('hidden-a'); at.setAttribute('aria-pressed', String(on)); at.textContent = on ? 'Mostrar respuesta modelo' : 'Ocultar para ensayar en voz alta'; });
  const mk = document.getElementById('mark');
  mk.addEventListener('click', () => {
    if (done.has(t.id)) done.delete(t.id); else done.add(t.id);
    saveState();
    mk.setAttribute('aria-pressed', String(done.has(t.id)));
    mk.textContent = done.has(t.id) ? '✓ Repasado' : 'Marcar como repasado';
    renderNav();
  });
}

/* ── Ejercicios ── */
const KIND = {output:'¿Qué imprime este código?', status:'¿Qué código de estado devuelve?', concept:'Pregunta rápida'};
function mountMcq(el, e, id){
  el.innerHTML = '<h3>'+KIND[e.kind]+'</h3><p class="hint" style="color:var(--ink)">'+e.q+'</p>'+(e.code?codeBlock(e.code,'py'):'')+'<div class="opts" role="group"></div><div class="fbx"></div>';
  const opts = el.querySelector('.opts'), fbx = el.querySelector('.fbx');
  e.opts.forEach((o,i) => {
    const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = o; b.id = id+'o'+i;
    b.addEventListener('click', () => {
      opts.querySelectorAll('.opt').forEach((x,j) => { x.disabled = true; if (j === e.a) x.classList.add('right'); });
      const ok = i === e.a;
      if (!ok) b.classList.add('wrong');
      fbx.innerHTML = '<div class="fb '+(ok?'right':'wrong')+'"><b>'+(ok?'Correcto.':'No.')+'</b> '+e.exp+'</div><div class="row" style="margin-top:8px"><button class="btn retry">Intentar de nuevo</button></div>';
      fbx.querySelector('.retry').addEventListener('click', () => mountMcq(el, e, id));
    });
    opts.appendChild(b);
  });
}
function mountClassify(el, e, id){
  el.innerHTML = '<h3>Clasifica</h3><p class="hint" style="color:var(--ink)">'+e.q+'</p><div class="cls"></div><p class="note score-c"></p>';
  const box = el.querySelector('.cls'); let answered = 0, right = 0;
  e.items.forEach((it,i) => {
    const row = document.createElement('div'); row.className = 'clsrow';
    row.innerHTML = '<span>'+it.t+'</span><div class="cats" role="group" aria-label="Opciones"></div>';
    const cats = row.querySelector('.cats');
    e.cats.forEach((c,j) => {
      const b = document.createElement('button'); b.textContent = c; b.id = id+'i'+i+'c'+j;
      b.addEventListener('click', () => {
        cats.querySelectorAll('button').forEach(x => { x.disabled = true; if (x.textContent === it.c) x.classList.add('right'); });
        const ok = c === it.c; if (!ok) b.classList.add('wrong');
        answered++; if (ok) right++;
        const w = document.createElement('p'); w.className = 'why'; w.innerHTML = (ok?'✓ ':'✗ Era <b>'+it.c+'</b>. ')+it.why; row.appendChild(w);
        if (answered === e.items.length) el.querySelector('.score-c').innerHTML = right+' de '+e.items.length+' correctas. <button class="btn retry" style="margin-left:6px">Repetir</button>';
        const r = el.querySelector('.retry'); if (r) r.addEventListener('click', () => mountClassify(el, e, id));
      });
      cats.appendChild(b);
    });
    box.appendChild(row);
  });
}

const DEMOS = {
 toggle(el, d){
  el.innerHTML = '<h3>'+d.title+'</h3><p class="hint">'+d.hint+'</p><div class="row tg" role="group"></div><div class="tv" style="display:flex;flex-direction:column;gap:8px"></div>';

  };
  d.options.forEach((o,i) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = o.label; b.addEventListener('click', () => show(i)); row.appendChild(b); });

 },
 stepper(el, d){
  let i = 0;
  el.innerHTML = '<h3>'+d.title+'</h3><p class="hint">'+d.hint+'</p><div class="sc"></div><div class="row"><span class="note sn" style="font-family:var(--f-mono)"></span></div><p class="st" style="margin:0"></p><pre class="out so"></pre><div class="row"><button class="btn sp">← Anterior</button><button class="btn primary sx">Siguiente →</button><button class="btn sr">Reiniciar</button></div>';
  const draw = () => {
    const s = d.steps[i];
    el.querySelector('.sc').innerHTML = codeBlock(d.code, 'py', s.hl);
    el.querySelector('.sn').textContent = 'Paso '+(i+1)+' de '+d.steps.length;
    el.querySelector('.st').innerHTML = s.text;
    const acc = d.steps.slice(0,i+1).map(x => x.out).filter(Boolean).join('\n');
    el.querySelector('.so').textContent = acc || '(sin salida todavía)';
    el.querySelector('.sp').disabled = i === 0;
    el.querySelector('.sx').disabled = i === d.steps.length-1;
  };
  el.querySelector('.sp').addEventListener('click', () => { if (i>0){ i--; draw(); } });
  el.querySelector('.sx').addEventListener('click', () => { if (i<d.steps.length-1){ i++; draw(); } });
  el.querySelector('.sr').addEventListener('click', () => { i = 0; draw(); });
  draw();
 },
 pipeline(el, d){
  const stages = d.stages || STAGES;
  el.innerHTML = '<h3>'+d.title+'</h3><p class="hint">'+d.hint+'</p><div class="row pg" role="group"></div><pre class="out pr"></pre><div class="stages">'+stages.map((s,i)=>'<div class="stage" data-i="'+i+'"><b>'+(i+1)+'</b>'+s+'</div>').join('')+'</div><ol class="log"></ol><div class="row"><span class="status"></span></div><pre class="out pb"></pre>';
  const row = el.querySelector('.pg');
  let timers = [];
  const run = k => {
    timers.forEach(clearTimeout); timers = [];
    row.querySelectorAll('.btn').forEach((b,j) => b.setAttribute('aria-pressed', String(j === k)));
    const sc = d.scenarios[k];
    el.querySelector('.pr').textContent = sc.req;
    const st = el.querySelectorAll('.stage'), log = el.querySelector('.log'), status = el.querySelector('.status'), body = el.querySelector('.pb');
    st.forEach(s => s.className = 'stage'); log.innerHTML = ''; status.textContent = ''; status.className = 'status'; body.textContent = '…';
    const step = reduceMotion ? 0 : 320;
    sc.st.forEach((state, j) => {
      timers.push(setTimeout(() => {
        if (state !== 'skip') st[j].classList.add('run');
        timers.push(setTimeout(() => {
          st[j].classList.remove('run'); st[j].classList.add(state);
          if (sc.log[j]) { const li = document.createElement('li'); li.textContent = sc.log[j]; log.appendChild(li); }
          if (j === sc.st.length - 1){
            status.textContent = sc.status+' '+({200:'OK',201:'Created',204:'No Content',401:'Unauthorized',403:'Forbidden',404:'Not Found',409:'Conflict',422:'Unprocessable Content',500:'Internal Server Error'}[sc.status]||'');
            status.classList.add('s'+String(sc.status)[0]);
            body.textContent = sc.body;
          }
        }, step*0.6));
      }, j*step));
    });
  };
  d.scenarios.forEach((s,k) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = s.label; b.addEventListener('click', () => run(k)); row.appendChild(b); });
  run(0);
 },
 timeline(el, d){
  el.innerHTML = '<h3>'+d.title+'</h3><p class="hint">'+d.hint+'</p><div class="row tm" role="group"></div><div class="tl"><div class="rows"></div><div class="axis">'+Array.from({length:d.max+1},(_,i)=>'<span>'+i+' s</span>').join('')+'</div></div><div class="row"><b>Tiempo total:</b><span class="total"></span></div><p class="note tn"></p><p class="note">Barra clara: esperando I/O (el hilo queda libre). Barra roja: ocupando el hilo o la CPU.</p>';
  const rowsEl = el.querySelector('.rows'), row = el.querySelector('.tm');
  el.querySelector('.tl').style.setProperty('--cell', (100/d.max)+'%');
  rowsEl.innerHTML = d.modes[0].bars.map(() => '<div class="tlrow"><span></span><div class="track"><div class="seg"></div></div></div>').join('');
  const show = k => {
    const m = d.modes[k];
    row.querySelectorAll('.btn').forEach((b,j) => b.setAttribute('aria-pressed', String(j === k)));
    rowsEl.querySelectorAll('.tlrow').forEach((r,i) => {
      const b = m.bars[i];
      r.querySelector('span').textContent = b.n;
      const seg = r.querySelector('.seg');
      seg.className = 'seg ' + (b.k === 'cpu' ? 'block' : 'wait');
      seg.style.left = (b.s/d.max*100)+'%'; seg.style.width = ((b.e-b.s)/d.max*100)+'%';
    });
    el.querySelector('.total').textContent = m.total;
    el.querySelector('.tn').textContent = m.note;
  };
  d.modes.forEach((m,k) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = m.label; b.addEventListener('click', () => show(k)); row.appendChild(b); });
  show(0);
 },
 mutable(el, d){
  let bad = [], calls = 0;
  const items = ['cafe','taza','filtro','molino','prensa'];
  el.innerHTML = '<h3>'+d.title+'</h3><p class="hint">'+d.hint+'</p><div class="cmp"><div class="bad"><span class="tag bad">carrito=[]</span>'+codeBlock('def agregar_item(item, carrito=[]):\n    carrito.append(item)\n    return carrito','py')+'<pre class="out mb">(sin llamadas)</pre></div><div class="good"><span class="tag good">carrito=None</span>'+codeBlock('def agregar_item(item, carrito=None):\n    if carrito is None:\n        carrito = []\n    carrito.append(item)\n    return carrito','py')+'<pre class="out mg">(sin llamadas)</pre></div></div><div class="row"><button class="btn primary mc">Llamar agregar_item(…)</button><button class="btn mr">Reiniciar</button></div><p class="note">Cada clic simula un cliente distinto que arma su propio carrito con un solo producto.</p>';
  const mb = el.querySelector('.mb'), mg = el.querySelector('.mg');
  const fmt = a => '[' + a.map(x => "'"+x+"'").join(', ') + ']';
  let logB = [], logG = [];
  el.querySelector('.mc').addEventListener('click', () => {
    const it = items[calls % items.length]; calls++;
    bad.push(it);
    logB.push("agregar_item('"+it+"') → "+fmt(bad));
    logG.push("agregar_item('"+it+"') → "+fmt([it]));
    mb.textContent = logB.join('\n'); mg.textContent = logG.join('\n');
  });
  el.querySelector('.mr').addEventListener('click', () => { bad = []; calls = 0; logB = []; logG = []; mb.textContent = '(sin llamadas)'; mg.textContent = '(sin llamadas)'; });
 },
 idem(el, d){
  let state, log;
  const reset = () => { state = {precio:8000, stock:10, pedidos:[], existe1:true}; log = []; };
  reset();
  const reqs = [
   {label:'PUT /productos/3 {"precio": 9000}', idem:true, run(){ state.precio = 9000; return '200 OK'; }},
   {label:'PATCH /productos/3 {"stock": "+1"}', idem:false, run(){ state.stock += 1; return '200 OK'; }},
   {label:'POST /pedidos {"producto_id": 3}', idem:false, run(){ const id = 1042 + state.pedidos.length; state.pedidos.push(id); return '201 Created (id '+id+')'; }},
   {label:'DELETE /pedidos/1', idem:true, run(){ if (state.existe1){ state.existe1 = false; return '204 No Content'; } return '404 Not Found'; }}
  ];
  el.innerHTML = '<h3>'+d.title+'</h3><p class="hint">'+d.hint+'</p><div class="opts ir"></div><div class="cmp"><div><span class="tag" style="color:var(--muted)">Estado del servidor</span><pre class="out is"></pre></div><div><span class="tag" style="color:var(--muted)">Respuestas</span><pre class="out il"></pre></div></div><div class="row"><button class="btn irs">Reiniciar</button></div><p class="note">Fíjate en el DELETE: la segunda respuesta es 404, pero el estado no cambia. La idempotencia se mide por el efecto, no por la respuesta.</p>';
  const draw = () => {
    el.querySelector('.is').textContent = 'producto 3: precio=' + state.precio + ', stock=' + state.stock + '\npedidos creados: ' + (state.pedidos.length ? state.pedidos.join(', ') : 'ninguno') + '\npedido 1: ' + (state.existe1 ? 'existe' : 'eliminado');
    el.querySelector('.il').textContent = log.length ? log.slice(-8).join('\n') : '(envía una petición)';
  };
  const ir = el.querySelector('.ir');
  reqs.forEach(r => {
    const b = document.createElement('button'); b.className = 'opt';
    b.innerHTML = '<code>'+esc(r.label)+'</code> <span class="freq '+(r.idem?'seguido':'aveces')+'" style="margin-left:6px">'+(r.idem?'idempotente':'no idempotente')+'</span>';
    b.addEventListener('click', () => { log.push(r.label.split(' ').slice(0,2).join(' ') + ' → ' + r.run()); draw(); });
    ir.appendChild(b);
  });
  el.querySelector('.irs').addEventListener('click', () => { reset(); draw(); });
  draw();
 }
};

/* ── Simulacro ── */
function renderSim(){
  let h = '<div class="wrap"><div class="title"><div class="eyebrow">Final</div><h1>Simulacro de entrevista</h1><p class="lead">Primero responde en voz alta cada pregunta abierta, con un cronómetro de unos 90 segundos, y solo después abre la respuesta modelo. Luego haz el test.</p></div>';
  h += '<section class="blk"><h2>Preguntas abiertas <small>'+OPEN_QS.length+'</small></h2>'+OPEN_QS.map((q,i)=>'<details class="open-q"><summary>'+(i+1)+'. '+q.q+'</summary><p>'+q.a+'</p></details>').join('')+'</section>';
  h += '<section class="blk"><h2>Test de opción múltiple <small>'+TEST_QS.length+' preguntas</small></h2><div id="test" class="ex"></div><div class="row"><button class="btn primary" id="grade">Calificar</button><button class="btn" id="retest">Reiniciar test</button></div><div id="result"></div></section></div>';
  main.innerHTML = h;
  const test = document.getElementById('test');
  const answers = {};
  const build = () => {
    test.innerHTML = '';
    for (const k in answers) delete answers[k];
    document.getElementById('result').innerHTML = '';
    document.getElementById('grade').disabled = false;
    TEST_QS.forEach((q,i) => {
      const c = document.createElement('div'); c.className = 'card';
      c.innerHTML = '<h3>'+(i+1)+'. <span style="font-weight:500">'+q.q+'</span></h3><div class="opts"></div><div class="fbx"></div>';
      const o = c.querySelector('.opts');
      q.opts.forEach((t,j) => {
        const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = t; b.id = 'q'+i+'o'+j; b.setAttribute('aria-pressed','false');
        b.addEventListener('click', () => { answers[i] = j; o.querySelectorAll('.opt').forEach((x,m) => { x.setAttribute('aria-pressed', String(m === j)); x.style.borderColor = m === j ? 'var(--accent)' : ''; x.style.background = m === j ? 'var(--accent-soft)' : ''; }); });
        o.appendChild(b);
      });
      test.appendChild(c);
    });
  };
  build();
  document.getElementById('grade').addEventListener('click', () => {
    let score = 0;
    [...test.children].forEach((c,i) => {
      const q = TEST_QS[i], opts = c.querySelectorAll('.opt');
      opts.forEach((x,j) => { x.disabled = true; x.style.borderColor = ''; x.style.background = ''; if (j === q.a) x.classList.add('right'); else if (answers[i] === j) x.classList.add('wrong'); });
      const ok = answers[i] === q.a; if (ok) score++;
      c.querySelector('.fbx').innerHTML = '<div class="fb '+(ok?'right':'wrong')+'"><b>'+(ok?'Correcto.':(answers[i]===undefined?'Sin responder.':'No.'))+'</b> '+q.exp+'</div>';
    });
    const pct = Math.round(score/TEST_QS.length*100);
    document.getElementById('result').innerHTML = '<div class="card"><span class="score">'+score+' / '+TEST_QS.length+'</span><p class="note">'+(pct>=85?'Listo para la entrevista en estos temas.':pct>=60?'Buen avance. Repasa los temas de las preguntas que fallaste.':'Vuelve a los temas marcados con «Casi siempre» y repite el test.')+'</p></div>';
    document.getElementById('grade').disabled = true;
    document.getElementById('result').scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block:'center'});
  });
  document.getElementById('retest').addEventListener('click', build);
}

renderNav();
route();
</script>
</body>
</html>
