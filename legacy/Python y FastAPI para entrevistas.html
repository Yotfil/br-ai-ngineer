<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python y FastAPI para entrevistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral fija con bloques y temas + columna de lectura de ~70ch; código siempre en panel oscuro */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --ink:#15201c; --muted:#56665f; --line:#d6dedb;
  --accent:#0d6b5e; --accent-soft:#e1efeb; --amber:#b76a12; --amber-soft:#f8ecd9;
  --bad:#b0362a; --bad-soft:#f8e3e0; --good:#2c7a46; --good-soft:#e2f1e6;
  --code-bg:#101a17; --code-ink:#dfe8e4; --code-line:#1e2b27;
  --c-kw:#7fd4c1; --c-str:#e9c27a; --c-com:#73867f; --c-num:#f0a07a; --c-deco:#c9a4f5; --c-fn:#9cc8f7;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1311; --surface:#141c19; --ink:#e2eae6; --muted:#93a49d; --line:#25312d;
    --accent:#4fbfa8; --accent-soft:#16302a; --amber:#e3a04a; --amber-soft:#33260f;
    --bad:#ea7a68; --bad-soft:#3a1c18; --good:#6cc28a; --good-soft:#15301f;
    --code-bg:#0a100e; --code-line:#18231f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1311; --surface:#141c19; --ink:#e2eae6; --muted:#93a49d; --line:#25312d;
  --accent:#4fbfa8; --accent-soft:#16302a; --amber:#e3a04a; --amber-soft:#33260f;
  --bad:#ea7a68; --bad-soft:#3a1c18; --good:#6cc28a; --good-soft:#15301f;
  --code-bg:#0a100e; --code-line:#18231f;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);padding:.08em .35em;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:300px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:20px 14px 40px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--f-display);font-size:1.15rem}
.brand span{color:var(--muted);font-size:.82rem}
.prog{padding:0 8px;display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:.78rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h4{margin:6px 8px 4px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.navlink{display:grid;grid-template-columns:26px 1fr 14px;align-items:center;gap:6px;text-decoration:none;color:var(--ink);padding:6px 8px;border-radius:7px;font-size:.88rem;line-height:1.3}
.navlink:hover{background:var(--accent-soft)}
.navlink[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.navlink .num{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.navlink .ok{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.navlink.done .ok{background:var(--good);border-color:var(--good)}
.navlink.hide{display:none}
.menu-btn{display:none}

main{min-width:0;padding:36px 40px 80px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.title h1{font-size:clamp(1.8rem,3.4vw,2.5rem);margin-top:6px}
.lead{font-size:1.08rem;max-width:68ch;margin:10px 0 0}
.freq{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-body);font-size:.75rem;font-weight:600;border-radius:99px;padding:2px 10px;white-space:nowrap}
.freq.casi{background:var(--amber);color:var(--surface)}
.freq.seguido{border:1.5px solid var(--amber);color:var(--amber)}
.freq.aveces{border:1.5px dashed var(--muted);color:var(--muted)}

section.blk{display:flex;flex-direction:column;gap:12px}
section.blk > h2{font-size:1.2rem;display:flex;align-items:baseline;gap:10px}
section.blk > h2 small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-weight:400}
.prose{max-width:70ch}
.prose p{margin:0 0 .6em}
.analogy{border-left:3px solid var(--amber);background:var(--amber-soft);padding:12px 16px;border-radius:0 var(--r) var(--r) 0;max-width:70ch}
.bridge{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;max-width:76ch}
.bridge b{color:var(--accent)}
ul.pit{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;font-size:1.02rem;position:relative}
.answer::before{content:"Respuesta modelo";display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.answer.hidden-a .atext{filter:blur(6px);user-select:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:var(--r);padding:14px 16px;overflow-x:auto;font:13.5px/1.6 var(--f-mono);tab-size:4}
pre.code .ln{display:block;padding:0 6px;margin:0 -6px;border-radius:4px}
pre.code .ln.hl{background:#2a4a41}
.k{color:var(--c-kw)} .s{color:var(--c-str)} .c{color:var(--c-com);font-style:italic} .n{color:var(--c-num)} .d{color:var(--c-deco)} .f{color:var(--c-fn)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.tag{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tag.bad{color:var(--bad)} .tag.good{color:var(--good)}
.cmp .bad pre{box-shadow:inset 3px 0 0 var(--bad)}
.cmp .good pre{box-shadow:inset 3px 0 0 var(--good)}
.cmp p{margin:0;font-size:.9rem;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:1rem;font-family:var(--f-body);font-weight:600}
.card .hint{color:var(--muted);font-size:.9rem;margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:.88rem;text-align:left}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.out{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px/1.55 var(--f-mono);white-space:pre-wrap;word-break:break-word}
.note{font-size:.9rem;color:var(--muted);margin:0}

.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stage{border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:.78rem;text-align:center;background:var(--bg);transition:background .2s,border-color .2s}
.stage b{display:block;font-size:.8rem}
.stage.run{border-color:var(--accent);background:var(--accent-soft)}
.stage.ok{border-color:var(--good);background:var(--good-soft)}
.stage.fail{border-color:var(--bad);background:var(--bad-soft)}
.stage.skip{opacity:.4}
.status{font-family:var(--f-mono);font-weight:600;font-size:1rem}
.status.s2{color:var(--good)} .status.s4,.status.s5{color:var(--bad)}
.log{margin:0;padding-left:1.1em;font-size:.88rem;display:flex;flex-direction:column;gap:3px}

.tl{position:relative;border:1px solid var(--line);border-radius:8px;padding:10px 12px 26px;background:var(--bg)}
.tlrow{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:8px;height:28px}
.tlrow span{font-size:.8rem;font-family:var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:16px;border-radius:4px;background:linear-gradient(90deg,transparent calc(100% - 1px),var(--line) calc(100% - 1px));background-size:var(--cell,25%) 100%}
.seg{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent);transition:left .35s,width .35s}
.seg.wait{background:var(--accent);opacity:.35}
.seg.block{background:var(--bad)}
.axis{position:absolute;left:150px;right:12px;bottom:4px;display:flex;justify-content:space-between;font:11px var(--f-mono);color:var(--muted)}
.total{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.ex{display:flex;flex-direction:column;gap:10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;text-align:left;font-size:.92rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opt code{background:transparent;padding:0}
.fb{border-radius:8px;padding:10px 12px;font-size:.92rem}
.fb.right{background:var(--good-soft)} .fb.wrong{background:var(--bad-soft)}
.cls{display:flex;flex-direction:column;gap:8px}
.clsrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.clsrow:last-child{border-bottom:0}
.clsrow .cats{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.clsrow .cats button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:.8rem;font-family:var(--f-mono)}
.clsrow .cats button.right{background:var(--good);border-color:var(--good);color:var(--surface)}
.clsrow .cats button.wrong{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.clsrow .why{grid-column:1/-1;font-size:.86rem;color:var(--muted);margin:0}

.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.pager a{text-decoration:none;font-size:.9rem;max-width:45%}
.mark{border:1.5px solid var(--good);color:var(--good);background:transparent;border-radius:99px;padding:8px 16px;font-weight:600}
.mark[aria-pressed="true"]{background:var(--good);color:var(--surface)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:96px}
.tcard:hover{border-color:var(--accent)}
.tcard .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.tcard b{font-weight:600;font-size:.95rem;line-height:1.3}
.tcard.done{box-shadow:inset 3px 0 0 var(--good)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fact span{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fact b{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.fact p{margin:4px 0 0;font-size:.82rem;color:var(--muted)}
details.open-q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.open-q summary{cursor:pointer;font-weight:600}
details.open-q p{margin:10px 0 0}
.score{font-family:var(--f-display);font-size:2rem}
table.mini{border-collapse:collapse;font-size:.88rem;width:100%}
table.mini td,table.mini th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.mini th{font-weight:600;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.tablewrap{overflow-x:auto}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:20;transform:translateX(-102%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex;position:sticky;top:10px;z-index:10;margin:10px 16px 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:.9rem}
  main{padding:16px 16px 60px}
  .cmp{grid-template-columns:1fr}
  .stages{grid-template-columns:repeat(3,1fr)}
  .tlrow{grid-template-columns:80px 1fr}
  .axis{left:100px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Temas">
    <div class="brand"><b>Python + FastAPI</b><span>Guía de entrevista y primera API</span></div>
    <div class="prog"><div class="bar"><i id="progbar"></i></div><span id="progtxt">0 de 22 temas repasados</span></div>
    <div class="filters" role="group" aria-label="Filtrar por frecuencia">
      <button class="chip" data-f="all" aria-pressed="true">Todos</button>
      <button class="chip" data-f="casi" aria-pressed="false">Casi siempre</button>
      <button class="chip" data-f="seguido" aria-pressed="false">Seguido</button>
      <button class="chip" data-f="aveces" aria-pressed="false">A veces</button>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div>
    <button class="menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">☰ Temas</button>
    <main id="main"></main>
  </div>
</div>
<script>
const TOPICS = [
/* ───────────── BLOQUE A: PYTHON ───────────── */
{
 id:1, block:'A', title:`Tipado dinámico y type hints`, short:`Tipado y type hints`, freq:'casi',
 def:`Python es de <b>tipado dinámico y fuerte</b>: las variables no tienen tipo, los valores sí, y no hay conversiones implícitas (<code>"1" + 1</code> lanza <code>TypeError</code>). Los <b>type hints</b> son anotaciones que el intérprete no hace cumplir; las verifican herramientas como mypy o pyright y, sobre todo, las leen FastAPI y Pydantic en tiempo de ejecución para validar.`,
 analogy:`Son como las etiquetas en las cajas de una mudanza: el camión no las lee y lleva la caja igual, pero quien desempaca (el IDE, mypy, FastAPI) sí las usa para saber qué hacer con cada una.`,
 code:`def total_pedido(precios: list[float], descuento: float = 0.0) -> float:
    return sum(precios) * (1 - descuento)

total_pedido([12_000.0, 8_500.0])   # 20500.0
total_pedido("abc")                 # Python no se queja hasta que sum() falla

cliente_id: int | None = None       # unión, como number | null en TS
contacto: dict[str, str] = {"email": "ana@mail.com"}`,
 problem:`Sin hints pierdes autocompletado y, en FastAPI, la validación automática: FastAPI no sabe que <code>id</code> debe ser entero. El mal uso típico es creer que el hint protege en ejecución.`,
 bad:{code:`def buscar_producto(id, incluir_stock=False):
    ...  # ¿id es int o str? ¿qué devuelve?`, note:`Nadie sabe qué recibe ni qué devuelve; FastAPI trataría id como str.`},
 good:{code:`def buscar_producto(id: int, incluir_stock: bool = False) -> Producto | None:
    ...`, note:`El contrato queda claro, el IDE ayuda y FastAPI valida que id sea entero.`},
 bridge:`<b>TypeScript:</b> los tipos se borran al compilar y el compilador bloquea el build si no cuadran. <b>Python:</b> no hay paso que bloquee (mypy es opcional), pero los hints <i>sí existen en ejecución</i> (<code>func.__annotations__</code>). Por eso FastAPI convierte <code>producto_id: int</code> en validación y documentación, algo que en TS requiere Zod o class-validator. Además TS es estructural; las clases de Python son nominales (para estructural existe <code>typing.Protocol</code>).`,
 pitfalls:[`Esperar que <code>x: int = "hola"</code> falle: Python lo acepta sin decir nada.`,`Pensar que <code>"1" + 1</code> da <code>"11"</code>: en Python es <code>TypeError</code>, conviertes explícitamente con <code>int()</code> o <code>str()</code>.`,`Truthiness distinta: <code>[]</code>, <code>{}</code>, <code>""</code> y <code>0</code> son falsy. En JS <code>[]</code> es truthy.`,`Solo existe <code>None</code>: no hay <code>null</code> y <code>undefined</code> por separado.`],
 answer:`Python es dinámico pero fuerte: los valores tienen tipo y no se convierten solos. Los type hints no se aplican en ejecución; los revisa una herramienta como mypy o pyright. La diferencia con TypeScript es que en TS los tipos desaparecen al compilar, mientras que en Python siguen disponibles en runtime, y por eso Pydantic y FastAPI los usan para validar datos y generar la documentación de la API.`,
 demo:{type:'toggle', title:`Laboratorio: ¿qué hace Python?`, hint:`Elige una línea y mira el resultado real.`, options:[
  {label:`"1" + 1`, code:`"1" + 1`, out:`TypeError: can only concatenate str (not "int") to str`, note:`Tipado fuerte: en JS daría "11".`},
  {label:`int("42") + 1`, code:`int("42") + 1`, out:`43`, note:`La conversión siempre es explícita.`},
  {label:`bool([])`, code:`bool([])`, out:`False`, note:`Colección vacía es falsy. En JS Boolean([]) es true.`},
  {label:`hint ignorado`, code:`x: int = "hola"
print(x)`, out:`hola`, note:`El intérprete no hace cumplir el hint. mypy sí marcaría error.`},
  {label:`hint y operación`, code:`def doble(n: int) -> int:
    return n * 2

doble("ab")`, out:`'abab'`, note:`Funciona porque str también soporta *. El hint no lo impidió.`}
 ]},
 ex:[
  {kind:'output', q:`¿Qué imprime?`, code:`def doble(n: int) -> int:
    return n * 2

print(doble("ha"))`, opts:[`TypeError`,`haha`,`0`,`None`], a:1, exp:`El hint no se aplica en ejecución. <code>"ha" * 2</code> es una operación válida que repite el string.`},
  {kind:'output', q:`¿Qué imprime?`, code:`print(bool(""), bool("0"), bool([0]))`, opts:[`False False False`,`False True True`,`True True True`,`False False True`], a:1, exp:`Solo el string vacío es falsy. <code>"0"</code> es un string con un carácter y <code>[0]</code> es una lista con un elemento: ambos truthy.`}
 ]
},
{
 id:2, block:'A', title:`Estructuras de datos: list, tuple, dict y set`, short:`list, tuple, dict, set`, freq:'casi',
 def:`<b>list</b>: secuencia ordenada y mutable. <b>tuple</b>: secuencia ordenada e inmutable (hashable si su contenido lo es). <b>dict</b>: clave → valor, conserva el orden de inserción y busca en O(1). <b>set</b>: elementos únicos sin orden, pertenencia en O(1).`,
 analogy:`list es la fila de pedidos en la barra; tuple, las coordenadas impresas en el recibo (no se reescriben); dict, el fichero de clientes por cédula; set, la lista de invitados donde nadie aparece dos veces.`,
 code:`carrito = ["cafe", "taza", "cafe"]          # list: orden y duplicados
ubicacion = (4.4389, -75.2322)               # tuple: inmutable
stock = {"cafe": 12, "taza": 3}              # dict
categorias = {"bebidas", "accesorios"}       # set

stock.get("filtro", 0)     # 0, sin KeyError
"cafe" in stock            # True en O(1)
set(carrito)               # {'cafe', 'taza'}
precio, cantidad = (25_000, 2)   # desempaquetado de tupla`,
 problem:`Buscar con <code>in</code> en una lista recorre todo (O(n)); en un set o dict es casi instantáneo. Usar list para datos que no deben cambiar invita a modificarlos por error.`,
 bad:{code:`ids_vip = [ ... 100_000 ids ... ]
for pedido in pedidos:
    if pedido.cliente_id in ids_vip:   # O(n) cada vez
        aplicar_descuento(pedido)`, note:`Con 10.000 pedidos son hasta mil millones de comparaciones.`},
 good:{code:`ids_vip = set(lista_ids)
for pedido in pedidos:
    if pedido.cliente_id in ids_vip:   # O(1)

 id:5, block:'A', title:`Decoradores`, short:`Decoradores`, freq:'casi',
 def:`Un decorador es una función que recibe una función y devuelve otra que la envuelve, para añadir comportamiento antes o después sin tocar su código. <code>@deco</code> encima de <code>def f</code> es azúcar sintáctico de <code>f = deco(f)</code>.`,
 analogy:`El papel de regalo: el producto es el mismo, pero antes de llegar a él pasas por la envoltura (logs, permisos, medición de tiempos).`,
 code:`import functools
import time

def medir_tiempo(func):
    @functools.wraps(func)          # conserva nombre, docstring y firma
    def wrapper(*args, **kwargs):
        inicio = time.perf_counter()
        resultado = func(*args, **kwargs)
        print(f"{func.__name__} tardó {time.perf_counter() - inicio:.3f}s")
        return resultado
    return wrapper

@medir_tiempo
def calcular_total(pedido_id: int) -> float:
    ...

# Decorador con argumentos: una capa más
def reintentar(veces: int):
    def decorador(func):
        @functools.wraps(func)
        def wrapper(*args, **kwargs):
            for intento in range(veces):
                try:
                    return func(*args, **kwargs)
                except ConnectionError:
                    if intento == veces - 1:
                        raise
        return wrapper
    return decorador`,
 problem:`Sin decoradores repites el mismo código de logs, caché o permisos en cada función. Mal escritos, rompen la función: devuelven None o borran su firma.`,
 bad:{code:`def log(func):
    def wrapper(*args, **kwargs):
        print("llamando", func.__name__)
        func(*args, **kwargs)        # falta return
    return wrapper                   # falta functools.wraps`, note:`La función decorada devuelve None y pierde su nombre y firma. FastAPI lee la firma para saber los parámetros: sin wraps se rompe.`},
 good:{code:`def log(func):
    @functools.wraps(func)
    def wrapper(*args, **kwargs):
        print("llamando", func.__name__)
        return func(*args, **kwargs)
    return wrapper`, note:`Devuelve el resultado y conserva los metadatos.`},
 bridge:`En Angular, <code>@Component</code> o <code>@Injectable</code> son decoradores de TS que adjuntan <i>metadatos</i> a la clase para que el framework los lea después. En Python el decorador es una función normal que se ejecuta al definir y <i>reemplaza</i> el objeto por lo que devuelva. <code>@app.get("/productos")</code> en FastAPI registra tu función en el router y te la devuelve igual.`,
 pitfalls:[`Olvidar <code>return resultado</code> en el wrapper.`,`Olvidar <code>@functools.wraps</code>.`,`Confundir <code>@deco</code> con <code>@deco()</code>: el segundo exige un decorador con argumentos.`,`Creer que el decorador corre en cada llamada: el decorador corre una vez al definir; el wrapper corre en cada llamada.`],
 answer:`Un decorador es una función de orden superior: recibe una función y devuelve otra que la envuelve. La sintaxis con arroba equivale a reasignar la función con el resultado del decorador. Por dentro defino un wrapper que acepta args y kwargs, hago algo antes, llamo a la original, hago algo después y devuelvo su resultado, usando functools.wraps para no perder el nombre ni la firma. FastAPI los usa para registrar rutas.`,
 demo:{type:'stepper', title:`Así envuelve un decorador a la función`, hint:`Sigue la ejecución línea por línea.`, code:`def medir_tiempo(func):
    def wrapper(*args, **kwargs):
        inicio = time.perf_counter()
        resultado = func(*args, **kwargs)
        print(f"tardó {time.perf_counter() - inicio:.3f}s")
        return resultado
    return wrapper

 id:6, block:'A', title:`Manejo de errores y context managers`, short:`Errores y with`, freq:'casi',
 def:`<code>try / except / else / finally</code> controla errores: <code>else</code> corre si no hubo excepción y <code>finally</code> corre siempre. Las excepciones propias heredan de <code>Exception</code>. Un <b>context manager</b> (<code>with</code>) garantiza preparación y limpieza, por medio de <code>__enter__</code>/<code>__exit__</code> o del decorador <code>@contextmanager</code>.`,
 analogy:`El <code>with</code> es el préstamo de llaves de la bodega con firma: pase lo que pase adentro, al salir devuelves las llaves.`,
 code:`class StockInsuficiente(Exception):
    def __init__(self, producto: str, pedido: int, disponible: int):
        super().__init__(f"{producto}: pediste {pedido}, hay {disponible}")
        self.producto = producto

def reservar(producto: str, cantidad: int) -> None:
    disponible = stock.get(producto, 0)
    if cantidad > disponible:
        raise StockInsuficiente(producto, cantidad, disponible)
    stock[producto] -= cantidad

try:
    reservar("cafe", 50)
except StockInsuficiente as e:
    print("No se pudo:", e)
else:
    print("Reservado")
finally:
    print("Fin del intento")

from contextlib import contextmanager

@contextmanager
def transaccion(sesion):
    try:
        yield sesion
        sesion.commit()
    except Exception:
        sesion.rollback()
        raise`,
 problem:`Tragarse errores esconde bugs y deja datos a medias. Sin <code>with</code>, un error en medio deja archivos abiertos o transacciones sin cerrar.`,
 bad:{code:`try:

except:
    pass`, note:`Atrapa todo, incluso Ctrl+C (KeyboardInterrupt), y nadie se entera del fallo.`},

except StockInsuficiente as e:
    logger.warning("Sin stock: %s", e)
    raise ErrorDePedido("No se pudo reservar") from e`, note:`Atrapas lo que esperas y conservas la causa original con <code>from e</code>.`},
 bridge:`<code>try/catch/finally</code> ≈ <code>try/except/finally</code>; <code>throw</code> → <code>raise</code>; <code>catch (e)</code> → <code>except Tipo as e</code>. El <code>with</code> no tiene equivalente clásico en JS; lo más parecido es <code>using</code> (gestión explícita de recursos, TS 5.2+). Python prefiere el estilo EAFP: intentar y capturar, en vez de verificar todo antes.`,
 pitfalls:[`<code>except:</code> sin tipo captura también <code>SystemExit</code> y <code>KeyboardInterrupt</code>.`,`No conocer el <code>else</code> del try: separa el código que puede fallar del que solo corre si todo salió bien.`,`Relanzar con <code>raise e</code> en vez de <code>raise</code> a secas cambia el punto de origen del traceback.`,`Heredar de <code>BaseException</code> en vez de <code>Exception</code>.`],
 answer:`Capturo excepciones específicas, nunca un except vacío. Uso else para el código que solo debe correr si no hubo error y finally para la limpieza obligatoria. Para errores de negocio creo excepciones propias que heredan de Exception, y encadeno causas con raise from. Para recursos como archivos, conexiones o transacciones uso context managers con with, que garantizan la liberación aunque haya una excepción.`,

 id:7, block:'A', title:`Módulos, paquetes, entornos virtuales y dependencias`, short:`Módulos, venv y uv`, freq:'seguido',
 def:`Un <b>módulo</b> es un archivo <code>.py</code>; un <b>paquete</b> es una carpeta de módulos (normalmente con <code>__init__.py</code>). Un <b>entorno virtual</b> aísla el intérprete y las librerías de cada proyecto. La documentación actual de FastAPI usa <b>uv</b> por defecto, con <code>pyproject.toml</code> y <code>uv.lock</code>.`,
 analogy:`El entorno virtual es la despensa propia de cada proyecto: no sacas ingredientes del mercado común ni le cambias la receta al vecino.`,
 code:`# Terminal (recomendado: uv)
uv init tienda-api && cd tienda-api
uv add "fastapi[standard]"
uv run fastapi dev app/main.py

# Alternativa clásica con venv + pip
python3 -m venv .venv
source .venv/bin/activate
pip install "fastapi[standard]"

# Estructura e imports

#   main.py
#   productos/
#     __init__.py
#     router.py

if __name__ == "__main__":     # solo si ejecutas el archivo directamente
    print("modo script")`,
 problem:`Sin entorno virtual, dos proyectos que necesitan versiones distintas de una librería se rompen entre sí, y lo que instalaste en el Python del sistema puede romper herramientas del Mac.`,

from app.utilidades import calcular_iva`, note:`Dependencia registrada en pyproject.toml y bloqueada en uv.lock; import explícito.`},
 bridge:`<code>pyproject.toml</code> ≈ <code>package.json</code>; <code>uv.lock</code> ≈ <code>package-lock.json</code>; <code>.venv</code> ≈ <code>node_modules</code>, pero además contiene el intérprete; PyPI ≈ registro de npm; <code>uv run</code> ≈ <code>npx</code>/<code>npm run</code>. Diferencia clave: Node busca <code>node_modules</code> solo; Python usa el entorno que esté activo, o el que <code>uv run</code> active por ti.`,
 pitfalls:[`Instalar sin activar el venv y luego no encontrar el paquete.`,`Llamar a tu archivo <code>fastapi.py</code> o <code>json.py</code>: tapa la librería real al importar.`,`Imports circulares entre módulos (A importa B y B importa A).`,`Commitear la carpeta <code>.venv</code> al repo.`],
 answer:`Cada archivo .py es un módulo y una carpeta de módulos es un paquete. Aíslo cada proyecto en un entorno virtual para que sus dependencias no choquen con otros proyectos ni con el sistema. Hoy uso uv: declara dependencias en pyproject.toml y fija versiones exactas en uv.lock, igual que package.json y el lockfile en Node. El bloque if name igual a main permite que un módulo sea importable y ejecutable a la vez.`,
 demo:{type:'toggle', title:`De npm a uv`, hint:`Elige el comando que ya conoces.`, options:[
  {label:`npm init`, code:`uv init tienda-api`, out:`Crea pyproject.toml, .python-version y main.py`, note:`El equivalente de package.json es pyproject.toml.`},
  {label:`npm install axios`, code:`uv add httpx`, out:`Agrega la dependencia a pyproject.toml y actualiza uv.lock`, note:`httpx es el cliente HTTP moderno, con modo sync y async.`},
  {label:`npm install`, code:`uv sync`, out:`Crea .venv e instala exactamente lo del lockfile`, note:`Lo que corres al clonar el repo.`},
  {label:`npm i -D jest`, code:`uv add --dev pytest`, out:`Dependencia de desarrollo`, note:`No se instala en producción si así lo configuras.`},
  {label:`npm run dev`, code:`uv run fastapi dev app/main.py`, out:`Servidor con recarga en http://127.0.0.1:8000`, note:`uv run ejecuta dentro del entorno del proyecto sin activarlo a mano.`}
 ]},
 ex:[
  {kind:'concept', q:`¿Qué archivo cumple el papel de <code>package-lock.json</code> con uv?`, opts:[`pyproject.toml`,`requirements.txt`,`uv.lock`,`.python-version`], a:2, exp:`<code>uv.lock</code> fija las versiones exactas de todo el árbol de dependencias.`},
  {kind:'concept', q:`¿Cuándo corre el código dentro de <code>if __name__ == "__main__":</code>?`, opts:[`Siempre`,`Cuando el archivo se ejecuta directamente, no cuando se importa`,`Solo en producción`,`Cuando se importa por primera vez`], a:1, exp:`Al importar, <code>__name__</code> es el nombre del módulo; al ejecutarlo directo vale <code>"__main__"</code>.`}
 ]
},
{
 id:8, block:'A', title:`Concurrencia: async/await, event loop, hilos, procesos y GIL`, short:`async, hilos y GIL`, freq:'casi',
 def:`<b>async/await</b> da concurrencia cooperativa en un solo hilo con un event loop (asyncio): ideal para esperas de I/O. Los <b>hilos</b> los gestiona el sistema operativo, pero en CPython el <b>GIL</b> deja que solo un hilo ejecute bytecode Python a la vez: sirven para I/O, no aceleran cálculos. Los <b>procesos</b> dan paralelismo real para trabajo de CPU. Python 3.13+ ofrece una compilación opcional sin GIL (free-threaded), pero la instalación estándar todavía lo tiene.`,
 analogy:`El event loop es un mesero que atiende varias mesas: toma un pedido y, mientras la cocina prepara (await), atiende otra mesa. Los hilos son varios meseros que comparten una sola libreta (el GIL): solo uno escribe a la vez. Los procesos son varias cocinas independientes.`,
 code:`import asyncio

async def consultar_inventario(producto: str) -> int:
    await asyncio.sleep(1)        # simula I/O: BD, API externa
    return 10

async def main():
    resultados = await asyncio.gather(
        consultar_inventario("cafe"),
        consultar_inventario("taza"),
        consultar_inventario("filtro"),
    )                              # ~1 s en total, no 3 s
    print(resultados)              # [10, 10, 10]

asyncio.run(main())

# Código bloqueante dentro de async: mándalo a un hilo
resultado = await asyncio.to_thread(generar_pdf_factura, pedido_id)`,
 problem:`Un <code>time.sleep()</code> o una librería bloqueante dentro de una corrutina congela todo el event loop: ninguna otra tarea avanza.`,
 bad:{code:`async def consultar(producto):
    time.sleep(1)                 # bloquea el loop
    return requests.get(url).json()  # requests es bloqueante`, note:`Parece async, pero atiende una cosa a la vez.`},
 good:{code:`async def consultar(producto):
    await asyncio.sleep(1)
    async with httpx.AsyncClient() as client:
        r = await client.get(url)
    return r.json()`, note:`Cada espera cede el control al event loop.`},
 bridge:`La sintaxis es casi igual a JS y <code>asyncio.gather</code> ≈ <code>Promise.all</code>. Diferencia clave: en JS una Promise empieza a ejecutarse en cuanto se crea; en Python una corrutina <b>no hace nada</b> hasta que la awaiteas o la conviertes en Task. Node también tiene un solo hilo con event loop, pero no tiene GIL porque nunca tuvo hilos de JS compartiendo memoria. RxJS añade streams y cancelación; asyncio tiene Tasks cancelables y async generators.`,
 pitfalls:[`Llamar una función async sin <code>await</code>: obtienes un objeto corrutina y el warning «was never awaited».`,`Usar librerías bloqueantes (requests, psycopg2, time.sleep) dentro de <code>async def</code>.`,`Creer que async acelera cálculos de CPU: solo ayuda a esperar mejor.`,`Usar hilos para paralelizar cálculo pesado: el GIL lo serializa.`],
 answer:`Async es concurrencia en un solo hilo: el event loop alterna entre tareas cada vez que una hace await sobre I/O, así que sirve para muchas esperas de red o base de datos. Los hilos también sirven para I/O, pero por el GIL solo uno ejecuta Python a la vez, así que no aceleran cálculos. Para trabajo de CPU uso procesos. En FastAPI lo importante es no bloquear el event loop dentro de un endpoint async.`,
 demo:{type:'timeline', title:`Tres tareas de 1 segundo`, hint:`Compara cómo se reparten en el tiempo.`, max:3, modes:[
  {label:`Secuencial`, total:`≈ 3.0 s`, bars:[{n:'inventario cafe',s:0,e:1,k:'wait'},{n:'inventario taza',s:1,e:2,k:'wait'},{n:'inventario filtro',s:2,e:3,k:'wait'}], note:`Cada espera de I/O bloquea a la siguiente.`},
  {label:`asyncio.gather (I/O)`, total:`≈ 1.0 s`, bars:[{n:'inventario cafe',s:0,e:1,k:'wait'},{n:'inventario taza',s:0,e:1,k:'wait'},{n:'inventario filtro',s:0,e:1,k:'wait'}], note:`Las tres esperas se solapan en un solo hilo.`},
  {label:`Hilos con CPU pesada`, total:`≈ 3.0 s`, bars:[{n:'calcular iva 1',s:0,e:1,k:'cpu'},{n:'calcular iva 2',s:1,e:2,k:'cpu'},{n:'calcular iva 3',s:2,e:3,k:'cpu'}], note:`El GIL hace que los hilos se turnen: no hay ganancia en CPU.`},
  {label:`Procesos con CPU pesada`, total:`≈ 1.0 s`, bars:[{n:'calcular iva 1',s:0,e:1,k:'cpu'},{n:'calcular iva 2',s:0,e:1,k:'cpu'},{n:'calcular iva 3',s:0,e:1,k:'cpu'}], note:`Cada proceso tiene su propio intérprete y su propio GIL: paralelismo real si hay núcleos.`}
 ]},
 ex:[
  {kind:'classify', q:`¿Qué herramienta de concurrencia usarías?`, cats:['async','hilos','procesos'], items:[
   {t:`Llamar a 50 APIs de proveedores con httpx.AsyncClient`, c:'async', why:`Muchas esperas de red con librería async.`},
   {t:`Redimensionar 10.000 fotos de productos`, c:'procesos', why:`CPU pesada: el GIL bloquea a los hilos.`},
   {t:`Usar un SDK legacy bloqueante sin versión async`, c:'hilos', why:`I/O bloqueante: un hilo (o asyncio.to_thread) evita congelar el loop.`},
   {t:`Calcular estadísticas de ventas en Python puro con millones de filas`, c:'procesos', why:`Cálculo de CPU.`}
  ]},
  {kind:'output', q:`¿Qué imprime?`, code:`async def f():
    return 1

print(f())`, opts:[`1`,`<coroutine object f at 0x...> y un RuntimeWarning`,`Promise { 1 }`,`None`], a:1, exp:`Llamar a una función async crea una corrutina pero no la ejecuta. Necesitas <code>await f()</code> o <code>asyncio.run(f())</code>.`}
 ]
},
{
 id:9, block:'A', title:`Dataclasses y Pydantic`, short:`Dataclasses y Pydantic`, freq:'casi',
 def:`<code>@dataclass</code> genera <code>__init__</code>, <code>__repr__</code> y <code>__eq__</code> a partir de las anotaciones, <b>sin validar</b>. <b>Pydantic</b> (<code>BaseModel</code>, v2) valida y convierte datos en ejecución, serializa a dict o JSON y genera JSON Schema. FastAPI está construido sobre Pydantic.`,
 analogy:`La dataclass es un formulario impreso: tiene casillas, pero nadie revisa lo que escribes. Pydantic es el funcionario de ventanilla que revisa cada casilla y te devuelve el formulario con la lista de errores.`,
 code:`from dataclasses import dataclass, field
from pydantic import BaseModel, EmailStr, Field, field_validator

@dataclass
class ItemCarrito:
    producto_id: int
    cantidad: int = 1
    notas: list[str] = field(default_factory=list)

class Cliente(BaseModel):
    nombre: str = Field(min_length=2)
    email: EmailStr                      # requiere email-validator
    edad: int | None = Field(default=None, ge=18)

    @field_validator("nombre")
    @classmethod
    def limpiar_nombre(cls, v: str) -> str:
        return v.strip().title()

c = Cliente(nombre="  ana  ", email="ana@mail.com", edad="30")
c.edad            # 30 (convirtió el string a int)
c.model_dump()    # {'nombre': 'Ana', 'email': 'ana@mail.com', 'edad': 30}
c.model_dump_json()`,
 problem:`Los datos externos (JSON de un cliente, variables de entorno) no son confiables. Una dataclass los acepta tal cual; Pydantic los valida en la frontera de tu sistema.`,
 bad:{code:`class Cliente(BaseModel):
    nombre: str
    class Config:              # Pydantic v1
        orm_mode = True

    @validator("nombre")       # v1, obsoleto
    def v(cls, v): ...

cliente.dict()                 # v1`, note:`Sintaxis de v1 que aún aparece en tutoriales viejos.`},
 good:{code:`from pydantic import BaseModel, ConfigDict, field_validator

class Cliente(BaseModel):
    model_config = ConfigDict(from_attributes=True)
    nombre: str

    @field_validator("nombre")
    @classmethod
    def v(cls, v: str) -> str: ...

cliente.model_dump()`, note:`Pydantic v2: model_config, field_validator, model_dump.`},
 bridge:`La dataclass ≈ una <code>interface</code> más una clase con constructor automático. Pydantic ≈ <b>Zod</b>: <code>Cliente(**datos)</code> o <code>Cliente.model_validate(datos)</code> ≈ <code>schema.parse(datos)</code>. La diferencia es que en Zod defines el esquema y <i>derivas</i> el tipo con <code>z.infer</code>; en Pydantic la clase con type hints es esquema y tipo a la vez.`,
 pitfalls:[`Poner <code>notas: list = []</code> en una dataclass: error, usa <code>field(default_factory=list)</code>.`,`Mezclar sintaxis de Pydantic v1 y v2 copiada de distintos tutoriales.`,`Sorprenderse de que <code>"30"</code> se convierta a <code>30</code>: es el modo lax por defecto; existe <code>strict=True</code>.`,`Usar <code>EmailStr</code> sin tener instalado email-validator (viene incluido en <code>fastapi[standard]</code>).`],
 answer:`Una dataclass genera el boilerplate de una clase de datos pero no valida nada. Pydantic valida y convierte los datos en tiempo de ejecución usando los type hints, devuelve errores detallados y sabe serializar a JSON y generar JSON Schema. Uso dataclasses para estructuras internas y Pydantic en las fronteras: requests, respuestas y configuración. Es parecido a Zod, pero el esquema es la propia clase.`,
 demo:{type:'toggle', title:`Pasa datos por el modelo Cliente`, hint:`Elige una entrada y mira qué devuelve Pydantic.`, options:[
  {label:`Datos válidos`, code:`Cliente(nombre="  ana  ", email="ana@mail.com", edad=30)`, out:`Cliente(nombre='Ana', email='ana@mail.com', edad=30)`, note:`El validador limpió el nombre.`},
  {label:`edad como string`, code:`Cliente(nombre="Ana", email="ana@mail.com", edad="30")`, out:`Cliente(nombre='Ana', email='ana@mail.com', edad=30)`, note:`Modo lax: "30" se convierte a int.`},
  {label:`edad "treinta"`, code:`Cliente(nombre="Ana", email="ana@mail.com", edad="treinta")`, out:`ValidationError: 1 validation error for Cliente
edad
  Input should be a valid integer, unable to parse string as an integer
  [type=int_parsing, input_value='treinta', input_type=str]`, note:`Error con campo, tipo de error y valor recibido.`},
  {label:`menor de 18`, code:`Cliente(nombre="Ana", email="ana@mail.com", edad=15)`, out:`ValidationError: 1 validation error for Cliente
edad
  Input should be greater than or equal to 18
  [type=greater_than_equal, input_value=15, input_type=int]`, note:`Restricción de Field(ge=18).`},
  {label:`sin email`, code:`Cliente(nombre="Ana")`, out:`ValidationError: 1 validation error for Cliente
email
  Field required [type=missing, input_value={'nombre': 'Ana'}, input_type=dict]`, note:`Campo obligatorio sin default.`}
 ]},
 ex:[
  {kind:'concept', q:`En Pydantic v2, ¿cómo conviertes un modelo a dict?`, opts:[`<code>.dict()</code>`,`<code>.model_dump()</code>`,`<code>dict(modelo)</code> es lo recomendado`,`<code>.to_json()</code>`], a:1, exp:`<code>.dict()</code> es de v1 y está deprecado. En v2 se usa <code>model_dump()</code> y <code>model_dump_json()</code>.`},
  {kind:'concept', q:`¿Qué pasa con <code>ItemCarrito(producto_id="abc")</code> si es una dataclass?`, opts:[`ValidationError`,`TypeError`,`Se crea sin error con producto_id = "abc"`,`Convierte a int`], a:2, exp:`Las dataclasses no validan tipos. Para eso existe Pydantic, o las dataclasses de Pydantic.`}
 ]
},
{
 id:10, block:'A', title:`Comparaciones clásicas: is vs ==, copias, mutabilidad`, short:`is, ==, copias`, freq:'casi',
 def:`<code>==</code> compara valor (llama a <code>__eq__</code>); <code>is</code> compara identidad, es decir, si es el mismo objeto en memoria. Mutables: list, dict, set y la mayoría de objetos. Inmutables: int, float, str, tuple, frozenset. La <b>copia superficial</b> duplica el contenedor pero comparte lo de adentro; la <b>profunda</b> lo copia todo de forma recursiva.`,
 analogy:`<code>is</code> pregunta si es la misma taza física; <code>==</code> pregunta si las dos tazas tienen el mismo café.`,
 code:`import copy

pedido = {"cliente": "Ana", "items": ["cafe", "taza"]}

alias = pedido                       # misma referencia
superficial = pedido.copy()          # o copy.copy(pedido), dict(pedido)
profunda = copy.deepcopy(pedido)

pedido["items"].append("filtro")
superficial["items"]   # ['cafe', 'taza', 'filtro']  ¡la lista es compartida!
profunda["items"]      # ['cafe', 'taza']

[1, 2] == [1, 2]       # True: compara contenido
[1, 2] is [1, 2]       # False: son dos objetos distintos

if cliente is None:    # forma correcta de comparar con None
    ...`,
 problem:`Confundir referencia con copia produce bugs fantasma: modificas el pedido de un cliente y cambia el de otro. Usar <code>is</code> para comparar valores funciona a veces por casualidad y falla en producción.`,
 bad:{code:`if estado == None: ...
if nombre is "Ana": ...
tablero = [[0] * 3] * 3`, note:`== None se puede sobrescribir; is con strings depende de detalles del intérprete; la última línea crea tres referencias a la misma fila.`},
 good:{code:`if estado is None: ...
if nombre == "Ana": ...
tablero = [[0] * 3 for _ in range(3)]`, note:`is solo para None, True y False (singletons); comprehension para filas independientes.`},
 bridge:`<code>is</code> se parece a <code>===</code> entre objetos (misma referencia). Pero <code>==</code> en Python compara contenido: <code>[1] == [1]</code> es True, mientras que en JS <code>[1] === [1]</code> es false. El spread <code>{...obj}</code> de JS es copia superficial, igual que <code>dict.copy()</code>, y <code>structuredClone</code> ≈ <code>copy.deepcopy</code>.`,
 pitfalls:[`<code>a = b = []</code> crea una sola lista con dos nombres.`,`<code>[[0] * 3] * 3</code>: cambiar una fila cambia las tres.`,`<code>is</code> con enteros pequeños (-5 a 256) «funciona» por caché de CPython y engaña.`,`Las tuplas son inmutables, pero si contienen una lista, esa lista sí cambia.`],
 answer:`== compara valores y is compara identidad. Uso is solo con singletons como None. Las listas, diccionarios y sets son mutables; los números, strings y tuplas son inmutables, por eso las tuplas pueden ser claves de diccionario. Asignar no copia: crea otra referencia. Una copia superficial duplica el contenedor y comparte los objetos internos; si hay estructuras anidadas que voy a modificar, uso deepcopy.`,
 demo:{type:'toggle', title:`Alias, copia superficial y profunda`, hint:`Aplica un cambio al pedido original y mira las tres variables.`, options:[
  {label:`pedido["items"].append("filtro")`, code:`pedido["items"].append("filtro")`, out:`alias       → {'cliente': 'Ana', 'items': ['cafe', 'taza', 'filtro']}
superficial → {'cliente': 'Ana', 'items': ['cafe', 'taza', 'filtro']}
profunda    → {'cliente': 'Ana', 'items': ['cafe', 'taza']}`, note:`Mutar un objeto interno se ve en la copia superficial porque comparte esa lista.`},
  {label:`pedido["cliente"] = "Luis"`, code:`pedido["cliente"] = "Luis"`, out:`alias       → {'cliente': 'Luis', 'items': ['cafe', 'taza']}
superficial → {'cliente': 'Ana', 'items': ['cafe', 'taza']}
profunda    → {'cliente': 'Ana', 'items': ['cafe', 'taza']}`, note:`Reasignar una clave del primer nivel no afecta a la copia superficial.`},
  {label:`pedido["items"] = []`, code:`pedido["items"] = []`, out:`alias       → {'cliente': 'Ana', 'items': []}
superficial → {'cliente': 'Ana', 'items': ['cafe', 'taza']}
profunda    → {'cliente': 'Ana', 'items': ['cafe', 'taza']}`, note:`Reasignar no es mutar: la copia sigue apuntando a la lista vieja.`}
 ]},
 ex:[
  {kind:'output', q:`¿Qué imprime?`, code:`a = [1, 2]
b = [1, 2]
print(a == b, a is b)`, opts:[`True True`,`True False`,`False False`,`False True`], a:1, exp:`Mismo contenido, distintos objetos.`},
  {kind:'output', q:`¿Qué imprime?`, code:`m = [[0] * 2] * 2
m[0][0] = 9
print(m)`, opts:[`[[9, 0], [0, 0]]`,`[[9, 0], [9, 0]]`,`[[9, 9], [0, 0]]`,`Error`], a:1, exp:`<code>* 2</code> sobre la lista externa repite la misma referencia a la fila.`},
  {kind:'classify', q:`¿Mutable o inmutable?`, cats:['mutable','inmutable'], items:[
   {t:`list`, c:'mutable', why:`append, pop y asignación por índice.`},
   {t:`tuple`, c:'inmutable', why:`No se puede reasignar un elemento.`},
   {t:`str`, c:'inmutable', why:`Cada operación crea un string nuevo.`},
   {t:`dict`, c:'mutable', why:`Se agregan y cambian claves.`},
   {t:`frozenset`, c:'inmutable', why:`Versión inmutable de set.`}
  ]}
 ]
},
/* ───────────── BLOQUE B: HTTP Y FASTAPI ───────────── */
{
 id:11, block:'B', title:`HTTP por dentro y principios REST`, short:`HTTP y REST`, freq:'casi',
 def:`HTTP es un protocolo de petición y respuesta <b>sin estado</b>: método + ruta + cabeceras + cuerpo opcional, y de vuelta código de estado + cabeceras + cuerpo. REST organiza la API alrededor de <b>recursos</b> (sustantivos como <code>/pedidos</code>) y usa cada método con su significado. Un método es <b>idempotente</b> si repetirlo deja el servidor en el mismo estado que hacerlo una vez.`,
 analogy:`Es la ventanilla de un restaurante: el método es el verbo (pedir, cambiar, cancelar), la ruta es el plato, las cabeceras son las notas del ticket y el código de estado es lo que responde el cajero.`,
 code:`POST /pedidos HTTP/1.1
Host: api.tienda.co
Authorization: Bearer eyJhbGciOiJIUzI1NiIs...
Content-Type: application/json

{"cliente_id": 7, "items": [{"producto_id": 3, "cantidad": 2}]}

HTTP/1.1 201 Created
Location: /pedidos/1042
Content-Type: application/json

{"id": 1042, "estado": "pendiente", "total": 50000}`, codeLang:'txt',
 table:{head:['Método','Uso','Seguro','Idempotente'], rows:[
  ['GET','Leer','Sí','Sí'],['POST','Crear / acción','No','No'],['PUT','Reemplazar completo','No','Sí'],['PATCH','Modificar parcial','No','No garantizado'],['DELETE','Eliminar','No','Sí']]},
 table2:{head:['Código','Cuándo'], rows:[
  ['200 OK','Lectura o actualización con cuerpo'],['201 Created','Recurso creado (con Location)'],['204 No Content','Éxito sin cuerpo, típico de DELETE'],['400 Bad Request','Petición mal formada o regla de negocio genérica'],['401 Unauthorized','No autenticado: falta token o es inválido'],['403 Forbidden','Autenticado, pero sin permiso'],['404 Not Found','El recurso no existe'],['409 Conflict','Choca con el estado actual: email duplicado, sin stock'],['422 Unprocessable Content','Validación fallida (lo usa FastAPI)'],['500 Internal Server Error','Error no controlado del servidor']]},
 problem:`Una API que usa verbos en las rutas y responde 200 para todo obliga al frontend a leer el cuerpo para saber si algo falló, y rompe cachés, reintentos e interceptores.`,
 bad:{code:`POST /crearPedido
GET  /borrarProducto?id=3
200 OK  {"error": "no existe"}`, note:`Verbos en la URL, un GET que modifica datos y un error disfrazado de éxito.`},
 good:{code:`POST   /pedidos          → 201 Created
DELETE /productos/3      → 204 No Content
GET    /pedidos/999      → 404 Not Found`, note:`Recursos en plural, el método dice la acción y el código dice el resultado.`},
 bridge:`Todo esto ya lo consumes con <code>HttpClient</code>: el <code>HttpErrorResponse</code> que llega a tu interceptor trae el <code>status</code> que ahora vas a decidir tú. Un GET idempotente es lo que permite que un interceptor de reintentos funcione sin duplicar pedidos.`,
 pitfalls:[`Confundir 401 (¿quién eres?) con 403 (sé quién eres y no puedes).`,`Pensar que idempotente significa «misma respuesta»: un segundo DELETE puede dar 404, pero el estado del servidor no cambia.`,`Usar PUT para cambios parciales.`,`Olvidar que HTTP no guarda estado: la autenticación viaja en cada petición.`],
 answer:`HTTP es petición y respuesta sin estado. En REST modelo recursos con sustantivos y uso los métodos por su semántica: GET lee y es seguro, POST crea, PUT reemplaza, PATCH modifica parcialmente y DELETE elimina. GET, PUT y DELETE son idempotentes: repetirlos deja el mismo estado, por eso se pueden reintentar sin riesgo; POST no. Respondo con el código adecuado: 201 al crear, 204 sin contenido, 401 sin autenticación, 403 sin permiso, 404, 409 en conflictos y 422 en validación.`,
 demo:{type:'idem', title:`Simulador de idempotencia`, hint:`Envía cada petición varias veces y observa el estado del servidor.`},
 ex:[
  {kind:'classify', q:`¿Qué método HTTP corresponde?`, cats:['GET','POST','PUT','PATCH','DELETE'], items:[
   {t:`Crear un pedido nuevo`, c:'POST', why:`Crea un recurso y no es idempotente.`},
   {t:`Listar los productos de la categoría café`, c:'GET', why:`Lectura con query param.`},
   {t:`Reemplazar todos los datos del cliente 7`, c:'PUT', why:`Reemplazo completo e idempotente.`},
   {t:`Cambiar solo el estado del pedido a «enviado»`, c:'PATCH', why:`Modificación parcial.`},

{
 id:12, block:'B', title:`Rutas, parámetros de ruta, query params y cuerpo`, short:`Rutas y parámetros`, freq:'casi',
 def:`Una <b>path operation</b> es método + ruta + función. FastAPI decide de dónde sale cada parámetro según su declaración: si su nombre aparece en la ruta es <b>path param</b>; si es un tipo simple que no está en la ruta, es <b>query param</b>; si es un modelo Pydantic, es el <b>body</b>. Con <code>Annotated</code> y <code>Path</code>/<code>Query</code> añades restricciones.`,
 analogy:`Una dirección de entrega: la ruta es la calle y el número (identifica el recurso), los query params son las instrucciones opcionales («dejar en portería») y el body es el paquete.`,
 code:`from typing import Annotated
from fastapi import FastAPI, Path, Query
from pydantic import BaseModel

app = FastAPI()

class ProductoCrear(BaseModel):
    nombre: str
    precio: int
    categoria: str | None = None

@app.get("/productos/destacados")          # rutas fijas antes que las dinámicas
async def destacados():
    return [{"id": 1, "nombre": "Café de origen"}]

@app.get("/productos/{producto_id}")
async def obtener_producto(producto_id: Annotated[int, Path(gt=0)]):
    return {"id": producto_id}

@app.get("/productos")
async def listar_productos(
    categoria: str | None = None,
    limite: Annotated[int, Query(ge=1, le=100)] = 20,
):
    return {"categoria": categoria, "limite": limite}

@app.post("/productos", status_code=201)
async def crear_producto(producto: ProductoCrear):
    return producto`,
 problem:`Las rutas se evalúan en orden. Si la dinámica va primero, <code>/productos/destacados</code> intenta convertir «destacados» a int y responde 422.`,
 bad:{code:`@app.get("/productos/{producto_id}")
async def obtener(producto_id: int): ...

@app.get("/productos/destacados")    # nunca se alcanza
async def destacados(): ...`, note:`GET /productos/destacados → 422 int_parsing.`},
 good:{code:`@app.get("/productos/destacados")
async def destacados(): ...

@app.get("/productos/{producto_id}")
async def obtener(producto_id: int): ...`, note:`Lo específico primero, lo genérico después.`},
 bridge:`En Express escribirías <code>app.get('/productos/:id', (req, res) => ...)</code> y convertirías <code>req.params.id</code> a mano. Aquí la conversión y validación salen del type hint. Es la misma idea de <code>:id</code> en el router de Angular, que luego lees con <code>ActivatedRoute</code>, pero sin parsear.`,
 pitfalls:[`El orden de las rutas importa.`,`Los query params llegan como texto; FastAPI los convierte según el hint (<code>?activo=true</code> → <code>True</code>).`,`Un parámetro sin default es obligatorio, aunque sea query.`,`<code>/productos/</code> con barra final redirige con un 307 a <code>/productos</code> si así la definiste.`],
 answer:`FastAPI infiere el origen de cada parámetro: si el nombre está en la ruta es path param, si es un tipo simple fuera de la ruta es query param y si es un modelo Pydantic es el cuerpo. Los type hints convierten y validan, y con Annotated más Path o Query agrego restricciones como mínimos y máximos. Si algo no cumple, responde 422 sin que yo escriba validaciones. Ojo con el orden: las rutas fijas van antes que las que tienen parámetros.`,

 id:13, block:'B', title:`Modelos de entrada y salida, validación y response_model`, short:`Modelos y response_model`, freq:'casi',
 def:`Separa los esquemas: lo que <b>entra</b> (<code>ClienteCrear</code>), lo que <b>sale</b> (<code>ClientePublico</code>) y lo que se <b>guarda</b>. El tipo de retorno del endpoint, o <code>response_model</code>, valida y <b>filtra</b> la respuesta: solo salen los campos del modelo de salida.`,
 analogy:`La carta que ve el cliente no muestra el costo de los ingredientes ni el proveedor, aunque la cocina los conozca.`,
 code:`from pydantic import BaseModel, ConfigDict, EmailStr, Field

class ClienteBase(BaseModel):
    nombre: str = Field(min_length=2)
    email: EmailStr

class ClienteCrear(ClienteBase):
    password: str = Field(min_length=8)

class ClientePublico(ClienteBase):
    model_config = ConfigDict(from_attributes=True)   # para leer objetos ORM
    id: int

@app.post("/clientes", status_code=201)
def crear_cliente(datos: ClienteCrear, session: SessionDep) -> ClientePublico:
    cliente = guardar_cliente(session, datos)   # tiene hashed_password
    return cliente                              # sale solo id, nombre, email

# Si devuelves un tipo distinto al anotado, usa response_model
@app.get("/clientes/{cliente_id}", response_model=ClientePublico)
def obtener_cliente(cliente_id: int, session: SessionDep):
    return session.get(Cliente, cliente_id)`,
 problem:`Con un solo modelo para todo terminas devolviendo el hash de la contraseña o permitiendo que el cliente envíe campos que no debería, como <code>es_admin</code>.`,
 bad:{code:`@app.post("/clientes")
def crear(datos: ClienteCrear) -> ClienteCrear:
    guardar(datos)
    return datos            # devuelve el password`, note:`El modelo de entrada se usa como salida.`},
 good:{code:`@app.post("/clientes", status_code=201)
def crear(datos: ClienteCrear) -> ClientePublico:
    return guardar(datos)   # FastAPI filtra`, note:`Entrada y salida separadas; la herencia evita repetir campos.`},
 bridge:`Es la idea de los DTO de NestJS o de tener <code>CreateClienteDto</code> y <code>ClienteResponse</code> en tus servicios de Angular. La diferencia es que aquí el modelo de salida no es solo un tipo: se valida y filtra en ejecución. Pydantic frente a una interfaz de TS: la interfaz desaparece al compilar; el modelo actúa.`,
 pitfalls:[`Usar el mismo modelo para entrada, salida y tabla.`,`Devolver un objeto ORM sin <code>from_attributes=True</code>.`,`Si tu respuesta no cumple el modelo de salida, el error es un <b>500</b> (bug tuyo), no un 422.`,`Por defecto los campos extra se ignoran; con <code>model_config = ConfigDict(extra="forbid")</code> los rechazas.`],
 answer:`Defino modelos distintos para entrada y salida, normalmente con una clase base compartida. La entrada valida lo que el cliente puede enviar y la salida controla lo que expongo: si anoto el retorno o uso response_model, FastAPI filtra los campos, así nunca se filtra un hash de contraseña. Si el body no cumple, el cliente recibe 422 con el detalle; si mi respuesta no cumple, es un 500 porque es un error del servidor.`,

{
 id:14, block:'B', title:`Inyección de dependencias con Depends`, short:`Depends`, freq:'casi',
 def:`<code>Depends</code> declara que el valor de un parámetro lo provee una función que FastAPI ejecuta <b>antes del handler, en cada petición</b>. Las dependencias pueden tener sus propias dependencias (un árbol), su resultado se cachea dentro de la misma petición, y si usan <code>yield</code> ejecutan limpieza después de responder.`,
 analogy:`El mise en place: antes de que el chef cocine, alguien le deja listos y medidos los ingredientes. El chef no va a la bodega ni lava los platos al final.`,
 code:`from typing import Annotated
from fastapi import Depends
from sqlmodel import Session, select

def get_session():
    with Session(engine) as session:
        yield session              # tras la respuesta, se cierra

SessionDep = Annotated[Session, Depends(get_session)]

def paginacion(pagina: int = 1, tamano: int = 20) -> dict:
    return {"offset": (pagina - 1) * tamano, "limit": tamano}

PaginacionDep = Annotated[dict, Depends(paginacion)]

@app.get("/pedidos")
def listar_pedidos(session: SessionDep, pag: PaginacionDep) -> list[PedidoPublico]:
    consulta = select(Pedido).offset(pag["offset"]).limit(pag["limit"])
    return session.exec(consulta).all()`,
 problem:`Sin dependencias repites en cada endpoint cómo abrir la sesión, leer el token o paginar, y no puedes reemplazar esas piezas en los tests.`,
 bad:{code:`session = Session(engine)       # global, compartida

@app.get("/pedidos")
def listar():
    return session.exec(select(Pedido)).all()`, note:`Una sesión compartida por todas las peticiones: datos cruzados y conexiones sin cerrar.`},
 good:{code:`@app.get("/pedidos")
def listar(session: SessionDep):
    return session.exec(select(Pedido)).all()`, note:`Una sesión por petición, cerrada al terminar y reemplazable en tests.`},
 bridge:`Se parece al inyector de Angular, pero hay diferencias que conviene decir en la entrevista. Angular resuelve por <b>tipo o token</b> y sus providers suelen ser singletons (<code>providedIn: 'root'</code>). FastAPI resuelve por <b>función</b>, la ejecuta en cada petición y sus parámetros pueden salir de la propia petición (query, cabeceras, body). Para tests, <code>app.dependency_overrides</code> ≈ <code>TestBed.overrideProvider</code>.`,
 pitfalls:[`Escribir <code>Depends(get_session())</code> con paréntesis: le pasas el resultado, no la función.`,`Esperar un singleton: cada petición crea su propio valor.`,`Poner lógica de negocio pesada dentro de las dependencias.`,`No crear alias con <code>Annotated</code> y repetir <code>Depends(...)</code> en todos los endpoints.`],
 answer:`Depends le dice a FastAPI que un parámetro lo produce otra función. FastAPI resuelve el árbol de dependencias antes del handler, en cada petición, y cachea los resultados dentro de esa petición. Con yield puedo abrir y cerrar recursos como la sesión de base de datos. A diferencia de Angular, no hay singletons por defecto ni resolución por tipo, y en tests reemplazo dependencias con dependency_overrides.`,
 demo:{type:'stepper', title:`Resolución de dependencias en GET /pedidos/mios`, hint:`Avanza paso a paso.`, code:`def get_session():
    with Session(engine) as session:
        yield session

SessionDep = Annotated[Session, Depends(get_session)]

def get_cliente_actual(token: TokenDep, session: SessionDep) -> Cliente:
    return buscar_por_token(session, token)

ClienteActual = Annotated[Cliente, Depends(get_cliente_actual)]

@app.get("/pedidos/mios")
def mis_pedidos(cliente: ClienteActual, session: SessionDep):
    return listar_por_cliente(session, cliente.id)`, steps:[
  {hl:[12,13], text:`Llega GET /pedidos/mios. FastAPI lee la firma: necesita cliente y session.`, out:``},
  {hl:[7], text:`Para cliente necesita get_cliente_actual, que a su vez pide token y session.`, out:``},
  {hl:[1,2,3], text:`Ejecuta get_session hasta el yield: abre la sesión.`, out:`sesión abierta`},
  {hl:[8], text:`Con token y sesión, resuelve el cliente.`, out:`cliente = Ana (id 7)`},
  {hl:[13], text:`El handler también pidió SessionDep: FastAPI reutiliza la misma sesión (caché por petición).`, out:`misma sesión, no se abre otra`},
  {hl:[14], text:`Corre el handler con todo listo.`, out:`200 OK [pedidos de Ana]`},
  {hl:[3], text:`Después de enviar la respuesta, continúa el código tras el yield: el with cierra la sesión.`, out:`sesión cerrada`}
 ]},
 ex:[
  {kind:'concept', q:`Dos dependencias del mismo endpoint piden <code>SessionDep</code>. ¿Cuántas veces corre <code>get_session</code> en esa petición?`, opts:[`Una`,`Dos`,`Una por cada endpoint de la app`,`Una sola vez al arrancar la app`], a:0, exp:`FastAPI cachea el resultado de cada dependencia dentro de la misma petición.`},
  {kind:'concept', q:`¿Qué está mal en <code>session: Session = Depends(get_session())</code>?`, opts:[`Nada`,`Falta async`,`Se pasa el resultado de llamar la función, no la función`,`Depends solo acepta clases`], a:2, exp:`Depends espera el callable: <code>Depends(get_session)</code>.`}
 ]
},
{
 id:15, block:'B', title:`Manejo de errores y HTTPException`, short:`HTTPException`, freq:'casi',
 def:`<code>raise HTTPException(status_code, detail)</code> corta la ejecución y FastAPI responde un JSON <code>{"detail": ...}</code> con ese código. Para errores de dominio, lo limpio es crear excepciones propias y traducirlas a HTTP con <code>@app.exception_handler</code>.`,
 analogy:`Es el cajero que te dice «ese plato no existe» en lugar de quedarse callado (500) o servirte un plato vacío (200 con null).`,
 code:`from fastapi import HTTPException, Request, status
from fastapi.responses import JSONResponse

@app.get("/pedidos/{pedido_id}")
def obtener_pedido(pedido_id: int, session: SessionDep) -> PedidoPublico:
    pedido = session.get(Pedido, pedido_id)
    if pedido is None:
        raise HTTPException(
            status_code=status.HTTP_404_NOT_FOUND,
            detail="Pedido no encontrado",
        )
    return pedido

# Excepción de dominio, sin saber nada de HTTP
class StockInsuficiente(Exception):
    def __init__(self, producto: str):
        self.producto = producto

@app.exception_handler(StockInsuficiente)
async def stock_insuficiente_handler(request: Request, exc: StockInsuficiente):
    return JSONResponse(status_code=409, content={"detail": f"Sin stock de {exc.producto}"})`,
 problem:`Devolver errores como respuestas 200 engaña al frontend y a los reintentos. Lanzar HTTPException desde la lógica de negocio la ata a HTTP y la vuelve difícil de reutilizar.`,
 bad:{code:`@app.get("/pedidos/{pedido_id}")
def obtener(pedido_id: int):
    pedido = buscar(pedido_id)
    if not pedido:
        return {"error": "no existe"}   # 200 OK`, note:`El cliente recibe 200 y tiene que adivinar.`},
 good:{code:`@app.get("/pedidos/{pedido_id}")
def obtener(pedido_id: int):
    pedido = buscar(pedido_id)
    if pedido is None:
        raise HTTPException(404, "Pedido no encontrado")
    return pedido`, note:`raise, no return, y el código correcto.`},
 bridge:`Equivale a <code>throw new NotFoundException()</code> en NestJS. Del otro lado, es lo que tu interceptor de Angular recibe como <code>HttpErrorResponse</code> con <code>error.detail</code>. El <code>exception_handler</code> es el equivalente a un filtro de excepciones global.`,
 pitfalls:[`Escribir <code>return HTTPException(...)</code> en vez de <code>raise</code>.`,`Capturar <code>Exception</code> en el handler y esconder el error real.`,`Lanzar HTTPException desde servicios o repositorios: mejor una excepción de dominio y un handler.`,`Filtrar trazas internas en el <code>detail</code> de un 500.`],
 answer:`Para errores esperados lanzo HTTPException con el código y un detail claro, por ejemplo 404 si no existe el recurso. Para reglas de negocio prefiero excepciones de dominio, como StockInsuficiente, que no saben nada de HTTP, y registro un exception handler que las traduce a la respuesta adecuada, por ejemplo 409. Así la lógica es reutilizable y testeable, y los errores no controlados terminan en 500 sin exponer detalles internos.`,

{"items": [{"producto_id": 3, "cantidad": 99}]}`, st:['ok','ok','ok','ok','fail','ok'], log:['Middleware: registra la petición','Ruta: POST /pedidos','Validación: OK','Dependencias: sesión y cliente','El servicio lanza StockInsuficiente("cafe")','exception_handler la traduce a 409'], status:409, body:`{"detail": "Sin stock de cafe"}`},

{
 id:16, block:'B', title:`Endpoints async vs sync`, short:`async def vs def`, freq:'seguido',
 def:`Un endpoint <code>async def</code> corre en el event loop: úsalo cuando todo lo que hace por dentro es awaitable (driver async, httpx). Un endpoint <code>def</code> normal FastAPI lo ejecuta en un <b>threadpool</b>, así que una llamada bloqueante no congela el servidor. Lo único realmente malo es poner código bloqueante dentro de <code>async def</code>. La propia documentación dice: si no sabes, usa <code>def</code> normal.`,
 analogy:`Un mesero async que se queda parado frente a la cocina esperando un plato bloquea a todo el restaurante. Si la tarea es de esperar sin poder avisar, mejor contrata un ayudante (el threadpool).`,
 code:`# 1. Bien: librería async dentro de async def
@app.get("/productos/{producto_id}")
async def obtener(producto_id: int, session: AsyncSessionDep):
    return await session.get(Producto, producto_id)

# 2. Bien: librería bloqueante con def (FastAPI usa el threadpool)
@app.get("/tasa-cambio")
def tasa_cambio():
    return requests.get("https://api.banco.co/usd").json()

# 3. Mal: bloqueante dentro de async def
@app.get("/reporte")
async def reporte():
    time.sleep(2)          # nadie más es atendido durante 2 s
    return {"ok": True}`,
 problem:`Con <code>async def</code> y una llamada bloqueante, todas las peticiones concurrentes se atienden en fila. Con carga real, la latencia se dispara.`,
 bad:{code:`@app.get("/clientes/{id}")
async def obtener(id: int):
    return psycopg2_buscar(id)   # driver sync en async def`, note:`Parece moderno y es el más lento de los tres.`},
 good:{code:`@app.get("/clientes/{id}")
def obtener(id: int):
    return psycopg2_buscar(id)   # threadpool`, note:`O cambias a un driver async y usas async def con await.`},
 bridge:`En Node todo corre en un solo hilo: bloquear en un handler bloquea el servidor entero, siempre. FastAPI te da una salida que Node no tiene: declarar el endpoint con <code>def</code> y dejar que lo ejecute en un hilo aparte.`,
 pitfalls:[`async def con <code>requests</code>, <code>time.sleep</code> o un driver sync.`,`Creer que async siempre es más rápido.`,`Hacer cálculo pesado dentro de un endpoint: muévelo a un proceso o a una cola de tareas.`,`El threadpool es limitado (40 hilos por defecto en AnyIO): no es infinito.`],
 answer:`Si dentro del endpoint uso solo librerías async, lo declaro con async def y hago await; si uso librerías bloqueantes, lo declaro con def normal y FastAPI lo ejecuta en un threadpool. El error grave es llamar código bloqueante dentro de async def, porque congela el event loop y serializa todas las peticiones. Para trabajo pesado de CPU no uso ninguno de los dos: lo mando a otro proceso o a una cola.`,
 demo:{type:'timeline', title:`4 peticiones simultáneas a un endpoint que espera 1 s de I/O`, hint:`Cambia la forma de declarar el endpoint.`, max:4, modes:[
  {label:`async def + await`, total:`≈ 1 s`, bars:[{n:'petición 1',s:0,e:1,k:'wait'},{n:'petición 2',s:0,e:1,k:'wait'},{n:'petición 3',s:0,e:1,k:'wait'},{n:'petición 4',s:0,e:1,k:'wait'}], note:`El event loop alterna entre las cuatro mientras esperan.`},
  {label:`def + librería bloqueante`, total:`≈ 1 s`, bars:[{n:'petición 1',s:0,e:1,k:'wait'},{n:'petición 2',s:0,e:1,k:'wait'},{n:'petición 3',s:0,e:1,k:'wait'},{n:'petición 4',s:0,e:1,k:'wait'}], note:`Cada una corre en un hilo del threadpool. Funciona bien hasta agotar los hilos.`},
  {label:`async def + time.sleep`, total:`≈ 4 s`, bars:[{n:'petición 1',s:0,e:1,k:'cpu'},{n:'petición 2',s:1,e:2,k:'cpu'},{n:'petición 3',s:2,e:3,k:'cpu'},{n:'petición 4',s:3,e:4,k:'cpu'}], note:`El loop queda bloqueado: las peticiones se atienden en fila.`}
 ]},
